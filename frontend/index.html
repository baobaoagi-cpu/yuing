<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="YULING" />
<title>YULING · 语灵通话</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="/assets/icon.svg" />
<link rel="apple-touch-icon" sizes="180x180" href="/assets/icon-180.png" />
<style>
  :root{ --ink:#000; --light:#fff; --dim:rgba(255,255,255,.55); --faint:rgba(255,255,255,.12);
         --live:#1d9e75; --warn:#d85a30; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:var(--ink); color:var(--light);
    font-family:-apple-system,"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    overscroll-behavior:none; }
  body{ display:flex; flex-direction:column; align-items:center; justify-content:space-between;
    padding:max(6vh,32px) 24px max(8vh,40px); text-align:center; }
  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

  .top{ display:flex; flex-direction:column; align-items:center; gap:6px; }
  .clock{ font-size:13px; color:var(--dim); letter-spacing:.06em; margin-bottom:4px; }
  .name{ font-size:26px; font-weight:500; letter-spacing:.08em; }
  .status{ font-size:15px; color:var(--dim); min-height:22px; letter-spacing:.04em; }

  #viz{ position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }
  /* 去背陈端倪: 锁定右下角, 各装置自适应, 不挡点击 */
  #bao-bg{ position:fixed; right:0; bottom:0; z-index:1; pointer-events:none;
    width:min(40vw,260px); height:auto; opacity:.92; user-select:none;
    -webkit-user-drag:none; }
  .stage{ flex:1; }
  .top, .controls{ position:relative; z-index:2; }
  .gear, .lamps, .panel{ z-index:3; }

  .controls{ position:relative; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:18px; min-height:150px; }
  .btn{ border:none; background:none; color:var(--light); cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:8px; font-size:13px; color:var(--dim); }
  /* 静音钮过场: 待机缩在挂断球中心(scale.2/透明), 连接滑出左侧长大 */
  .mutefab{ position:absolute; left:50%; top:10px;
    transform:translateX(-50%) scale(.2); opacity:0; pointer-events:none;
    transition:transform .5s cubic-bezier(.34,1.25,.5,1), opacity .4s ease; }
  .mutefab.show{ transform:translateX(calc(-50% - 102px)) scale(1); opacity:1; pointer-events:auto; }
  .circle{ width:64px; height:64px; border-radius:50%; border:1px solid var(--faint);
    display:flex; align-items:center; justify-content:center; transition:background .2s, opacity .2s; }
  .circle svg{ width:26px; height:26px; }
  .btn:active .circle{ transform:scale(.94); }
  .call{ width:84px; height:84px; }
  .call.go{ background:var(--live); border-color:var(--live); }
  .call.end{ background:var(--warn); border-color:var(--warn); }
  .btn[disabled]{ opacity:.3; pointer-events:none; }
  .hidden{ display:none !important; }

  .gear{ position:absolute; top:max(4vh,18px); left:20px; color:var(--dim);
    background:none; border:none; cursor:pointer; padding:8px; }
  .gear svg{ width:22px; height:22px; }

  /* Only components observable on the deployed call path are shown. */
  .lamps{ position:absolute; top:max(3vh,10px); left:0; right:0; display:flex;
    flex-wrap:wrap; justify-content:center; gap:7px 12px; max-width:370px; margin:auto; padding:0 8px; }
  .lamp{ display:flex; align-items:center; gap:4px; font-size:10px; color:var(--dim);
    letter-spacing:0; white-space:nowrap; flex:none; }
  .lamp .dot{ width:7px; height:7px; border-radius:50%; background:var(--faint);
    flex:none; transition:background .3s, box-shadow .3s; }
  .lamp.ok   .dot{ background:var(--live); box-shadow:0 0 6px rgba(29,158,117,.7); }
  .lamp.bad  .dot{ background:var(--warn); box-shadow:0 0 6px rgba(216,90,48,.7); }
  .lamp.warn .dot{ background:#e0a52e; box-shadow:0 0 6px rgba(224,165,46,.6); }
  .lamp.ok{ color:rgba(255,255,255,.8); }
  #meetingView,#swipeHint{ display:none !important; }
  .panel{ position:absolute; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.94);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    padding:32px; }
  .panel input{ width:min(86vw,320px); height:46px; background:#0c0c0c; border:1px solid var(--faint);
    color:var(--light); border-radius:12px; padding:0 16px; font-size:16px; text-align:center; }
  .panel label{ font-size:14px; color:var(--dim); }
  .panel .save{ background:var(--light); color:var(--ink); border:none; border-radius:12px;
    padding:12px 32px; font-size:16px; font-weight:500; cursor:pointer; }
  .hint{ font-size:12px; color:var(--dim); max-width:300px; line-height:1.6; }
  .panel .linkbtn{ background:none; border:1px solid var(--faint); color:var(--dim);
    border-radius:12px; padding:11px 26px; font-size:15px; cursor:pointer; }
  .panel .linkbtn:hover{ color:var(--light); border-color:var(--dim); }
  /* 对话记录面板 */
  .logpanel{ justify-content:flex-start; padding:0; background:#090a05; }
  .logbar{ display:flex; align-items:center; gap:14px; width:100%;
    padding:max(4vh,18px) 20px 14px; border-bottom:1px solid var(--faint); }
  .logbar button{ background:none; border:none; color:var(--dim); font-size:16px; cursor:pointer; padding:4px; }
  .logbar button:hover{ color:var(--light); }
  .logbar .ttl{ font-size:16px; color:var(--light); font-weight:500; }
  .logbody{ flex:1; width:100%; max-width:560px; overflow-y:auto;
    padding:14px 18px 28px; display:flex; flex-direction:column; gap:10px;
    -webkit-overflow-scrolling:touch; }
  .logbody.detail{ max-width:920px; gap:16px; }
  .logempty{ color:var(--dim); font-size:14px; text-align:center; margin-top:40px; line-height:1.8; }
  .callitem{ background:#0c0c0c; border:1px solid var(--faint); border-radius:14px;
    padding:14px 16px; cursor:pointer; text-align:left; }
  .callitem:hover{ border-color:var(--dim); }
  .callitem .when{ font-size:14px; color:var(--light); }
  .callitem .meta{ font-size:12px; color:var(--dim); margin-top:3px; }
  .callitem .prev{ font-size:13px; color:var(--dim); margin-top:7px; line-height:1.5;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .turn{ max-width:82%; padding:9px 13px; border-radius:14px; font-size:15px; line-height:1.55; }
  .turn .tts{ display:block; font-size:10px; color:var(--dim); margin-bottom:3px; opacity:.7; }
  .turn.bao{ align-self:flex-start; background:#141414; border:1px solid var(--faint);
    color:var(--light); border-bottom-left-radius:4px; }
  .turn.coach{ align-self:flex-end; background:#1d2733; color:#dfeaf5; border-bottom-right-radius:4px; }
  .turn.coach .tts{ text-align:right; }
  .audiobar{ position:relative; background:rgba(0,0,0,.96); border:1px solid var(--faint);
    border-radius:14px; padding:12px 14px; display:flex; flex-direction:column; gap:10px; margin-bottom:4px; }
  .audiobar.primary{ position:sticky; top:0; z-index:2; }
  .audiobar audio{ width:100%; height:34px; }
  .audiobar .noaud{ font-size:13px; color:var(--dim); text-align:center; }
  .audiobar .keeprow{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .audiobar .keepstatus{ font-size:12px; color:var(--dim); }
  .keepbtn{ background:none; border:1px solid var(--faint); color:var(--dim);
    border-radius:10px; padding:8px 16px; font-size:13px; cursor:pointer; white-space:nowrap; }
  .keepbtn.on{ background:rgba(224,165,46,.16); border-color:#e0a52e; color:#e8c46a; }
  .callitem .badges{ font-size:12px; margin-top:4px; }
  .detailgrid{ display:grid; grid-template-columns:minmax(0,1fr); gap:16px; align-items:start; }
  .detailmeta{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; }
  .timelinecard{ display:flex; flex-direction:column; gap:12px; min-height:0; }
  .turnlist{ display:flex; flex-direction:column; gap:12px; min-height:0; }
  .verlink{ position:relative; z-index:3; background:none; border:none; color:rgba(255,255,255,.34); font-size:11px;
    letter-spacing:.1em; cursor:pointer; padding:6px 12px; }
  .verlink:hover{ color:var(--dim); }
  .veritem{ border:1px solid var(--faint); border-radius:12px; padding:12px 14px; }
  .veritem .vh{ display:flex; align-items:center; gap:8px; }
  .veritem .vtype{ font-size:11px; padding:2px 9px; border-radius:6px; white-space:nowrap; }
  .veritem .vtime{ font-size:11px; color:var(--dim); letter-spacing:.04em; }
  .veritem .vtitle{ font-size:14px; color:var(--light); margin-top:7px; line-height:1.5; }
  .veritem .vdesc{ font-size:12px; color:var(--dim); margin-top:4px; line-height:1.55; }
  .inneritem{ border:1px solid var(--faint); border-left:2px solid rgba(255,255,255,.18);
    border-radius:12px; padding:13px 16px; }
  .inneritem .it{ font-size:11px; color:var(--dim); margin-bottom:7px; letter-spacing:.04em; }
  .inneritem .ix{ font-size:14px; color:rgba(255,255,255,.82); line-height:1.7; white-space:pre-wrap; }
  .callpane{ position:relative; z-index:2; transition:transform .34s ease, opacity .34s ease; will-change:transform,opacity; touch-action:pan-y; }
  .meetingview{ position:fixed; inset:0; z-index:2; padding:max(7.4vh,58px) 16px max(4.8vh,22px);
    display:flex; align-items:stretch; justify-content:flex-start; pointer-events:none; opacity:0; touch-action:pan-y;
    transform:translate3d(calc(-100% - 18px),0,0); transition:transform .34s ease, opacity .34s ease; }
  .meetingview.open{ pointer-events:auto; opacity:1; transform:translate3d(0,0,0); }
  .meetingsheet{ width:min(100%,540px); height:100%; display:grid; grid-template-rows:auto minmax(0,1fr) auto;
    max-height:100%; overflow:hidden; gap:12px; padding:12px; border:1px solid rgba(255,255,255,.08); border-radius:18px; touch-action:pan-y;
    background:linear-gradient(180deg,rgba(8,10,10,.9),rgba(8,8,8,.72)); backdrop-filter:blur(14px); }
  .meetinghead{ display:block; }
  .meetingtopwave{ height:28px; border-radius:12px; border:1px solid rgba(255,255,255,.06);
    background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.008)); overflow:hidden; }
  .meetingbody{ min-height:0; display:grid; grid-template-rows:minmax(420px,1fr) auto; gap:10px; }
  .meetingbody.expanded{ grid-template-rows:minmax(540px,1fr) auto; }
  .recordcard,.meetingactionbar{ border:1px solid rgba(255,255,255,.08); border-radius:16px; background:rgba(255,255,255,.03); text-align:left; overflow:hidden; }
  .recordcard{ display:grid; grid-template-rows:auto minmax(172px,1fr); padding:12px; gap:10px; }
  .recordmeta{ display:flex; align-items:center; flex-wrap:wrap; gap:10px 12px; }
  .recordmeta .grow{ flex:1 1 auto; }
  .transportbar{ display:flex; align-items:center; gap:10px; min-height:36px; padding:0 2px; }
  .transportpill{ display:inline-flex; align-items:center; min-height:28px; padding:0 12px; border-radius:999px; border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.05); color:var(--light); font-size:12px; white-space:nowrap; }
  .transportpill.connecting{ border-color:rgba(115,197,255,.34); background:rgba(115,197,255,.12); color:#dff5ff; }
  .transportpill.backend-live{ border-color:rgba(86,214,154,.38); background:rgba(29,158,117,.16); color:#e9fff4; }
  .transportpill.append-reconnect,.transportpill.rollover{ border-color:rgba(255,204,94,.34); background:rgba(255,204,94,.12); color:#fff1c5; }
  .transportpill.stream-dead,.transportpill.error{ border-color:rgba(234,90,69,.34); background:rgba(234,90,69,.12); color:#ffe2dc; }
  .transportpill.fallback-active{ border-color:rgba(179,120,255,.34); background:rgba(179,120,255,.12); color:#f0e6ff; }
  .transportpill.closed,.transportpill.idle{ border-color:rgba(255,255,255,.1); background:rgba(255,255,255,.05); color:rgba(255,255,255,.76); }
  .transportdetail{ min-width:0; flex:1 1 auto; font-size:12px; line-height:1.55; color:rgba(255,255,255,.64); }
  .recordtoggle{ display:inline-flex; align-items:center; gap:8px; min-height:32px; padding:0 10px; border-radius:999px;
    border:1px solid rgba(255,255,255,.08); background:rgba(255,255,255,.04); color:rgba(255,255,255,.72); font-size:12px; }
  .recordtoggle input{ width:15px; height:15px; accent-color:#56d69a; }
  .recordbadge{ display:inline-flex; align-items:center; gap:7px; border-radius:999px; padding:6px 10px; font-size:12px;
    background:rgba(255,255,255,.06); color:var(--light); }
  .expandbtn{ min-width:42px; height:36px; padding:0 12px; border-radius:11px; border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.04); color:var(--light); font-size:16px; cursor:pointer; }
  .expandbtn[aria-pressed="true"]{ background:rgba(29,158,117,.14); border-color:rgba(29,158,117,.38); color:#dff8ee; }
  .recordbadge.live::before,.recordbtn.live::before{ content:''; width:8px; height:8px; border-radius:50%; background:#ea5a45; box-shadow:0 0 12px rgba(234,90,69,.85); }
  .recordbadge.pause::before{ content:''; width:8px; height:8px; border-radius:50%; background:#e0a52e; box-shadow:0 0 10px rgba(224,165,46,.75); }
  .recordbadge.idle::before{ content:''; width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.24); }
  .recordtimer{ font-size:28px; font-variant-numeric:tabular-nums; letter-spacing:.05em; color:var(--light); }
  .recordhint{ font-size:12px; color:rgba(255,255,255,.5); }
  .recordwave{ width:100%; height:100%; display:block;
    background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.08),rgba(255,255,255,.01) 65%,rgba(255,255,255,0) 100%); }
  .chunkrail{ min-height:172px; overflow:auto; display:flex; flex-direction:column; gap:8px; padding-right:4px; align-self:stretch; }
  .chunkitem{ border:1px solid rgba(255,255,255,.07); border-radius:12px; padding:10px 12px; background:rgba(0,0,0,.18); }
  .chunkitem.active{ border-color:rgba(29,158,117,.42); background:rgba(29,158,117,.08); }
  .chunkhead{ display:flex; align-items:center; justify-content:space-between; gap:12px; font-size:12px; color:var(--dim); }
  .chunkname{ color:var(--light); font-size:13px; }
  .chunksub{ margin-top:6px; font-size:12px; color:rgba(255,255,255,.58); line-height:1.55; }
  .livestream{ display:flex; flex-direction:column; min-height:100%; }
  .livepad{ min-height:100%; border:1px solid rgba(255,255,255,.06); border-radius:14px;
    background:rgba(255,255,255,.025); padding:14px 16px; overflow:auto; }
  .livepad.blank{ background:rgba(255,255,255,.015); }
  .liveflow{ display:flex; flex-direction:column; gap:10px; min-height:100%; }
  .livefinal,.liveinterimline{ font-size:15px; line-height:1.78; word-break:break-word; white-space:pre-wrap; }
  .livefinal{ color:rgba(255,255,255,.86); }
  .liveinterimline{ color:#fff; }
  .liveanchor{ width:100%; height:1px; margin:0; opacity:0; pointer-events:none; }
  .liverow{ border:1px solid rgba(255,255,255,.06); border-radius:12px; padding:10px 12px; background:rgba(255,255,255,.025); }
  .liverow.active{ border-color:rgba(29,158,117,.42); background:rgba(29,158,117,.08); }
  .livestamp{ display:block; font-size:11px; color:rgba(255,255,255,.42); margin-bottom:6px; }
  .livetext{ font-size:14px; color:rgba(255,255,255,.84); line-height:1.7; word-break:break-word; }
  .liverow.active .livetext{ color:#fff; }
  .livecaret{ display:inline-block; width:10px; color:#56d69a; animation:blink 1s steps(1,end) infinite; }
  .streammeta{ font-size:12px; color:rgba(255,255,255,.52); line-height:1.6; }
  @keyframes blink{ 50%{ opacity:0; } }
  .meetingactionbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; min-height:68px; }
  .actionmeta{ min-width:0; display:flex; flex-direction:column; gap:6px; }
  .actiontitle{ font-size:14px; color:var(--light); letter-spacing:.03em; }
  .actionstatus{ font-size:12px; color:var(--dim); line-height:1.5; }
  .actionbtn{ min-height:42px; padding:0 16px; border-radius:12px; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.06); color:var(--light); font-size:13px; cursor:pointer; white-space:nowrap; }
  .actionbtn[disabled]{ opacity:.36; cursor:default; }
  .meetingempty{ margin:auto 0; text-align:center; color:var(--dim); font-size:13px; line-height:1.8; padding:12px 6px; }
  .meetingcontrols{ display:grid; grid-template-columns:1fr auto 1fr; gap:12px; align-items:end; }
  .meetbtn{ min-height:46px; border-radius:14px; border:1px solid rgba(255,255,255,.08); background:rgba(255,255,255,.04);
    color:var(--light); font-size:14px; cursor:pointer; }
  .meetbtn[disabled]{ opacity:.32; cursor:default; }
  .recordbtn{ width:88px; height:88px; border-radius:50%; border:none; margin:0 auto; background:#1d9e75; color:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px; font-size:12px; cursor:pointer;
    box-shadow:0 20px 38px rgba(29,158,117,.22); }
  .recordbtn.stop{ background:#d85a30; box-shadow:0 20px 38px rgba(216,90,48,.2); }
  .recordbtn.pause{ background:#94743c; box-shadow:0 18px 32px rgba(148,116,60,.18); }
  .recordbtn span{ pointer-events:none; }
  .swipehint{ position:fixed; left:14px; top:50%; transform:translateY(-50%); z-index:2; pointer-events:auto;
    writing-mode:vertical-rl; font-size:11px; letter-spacing:.18em; color:rgba(255,255,255,.28); transition:opacity .24s ease;
    cursor:pointer; user-select:none; -webkit-user-select:none; }
  .swipehint.hide{ opacity:0; }
  @media (max-width:700px){
    .lamps{ top:14px; }
    .gear{ top:54px; left:12px; }
    .top.callpane{ margin-top:62px; }
    .logbody{ max-width:none; padding:12px 12px 24px; }
    .logbody.detail{ max-width:none; gap:12px; }
    .detailgrid,.detailmeta{ gap:12px; }
    .detailmeta{ grid-template-columns:1fr; }
    .meetingview{ padding:max(6.2vh,50px) 8px max(2vh,10px); }
    .meetingsheet{ width:100%; gap:8px; padding:8px; border-radius:16px; }
    .meetingbody{ gap:8px; grid-template-rows:minmax(392px,1fr) auto; }
    .meetingbody.expanded{ grid-template-rows:minmax(520px,1fr) auto; }
    .meetingactionbar{ align-items:flex-start; flex-direction:column; }
    .meetingtopwave{ height:24px; }
    .recordcard{ grid-template-rows:auto minmax(196px,1fr); padding:10px; gap:8px; }
    .chunkrail{ min-height:196px; }
    .recordmeta{ gap:8px 10px; }
    .recordbadge{ padding:5px 9px; font-size:11px; }
    .recordtimer{ font-size:20px; }
    .expandbtn{ min-width:38px; height:32px; padding:0 10px; font-size:15px; }
    .recordhint,.chunksub,.actionstatus{ font-size:12px; }
    .meetingcontrols{ gap:10px; }
    .meetbtn{ min-height:40px; font-size:13px; }
    .recordbtn{ width:74px; height:74px; font-size:11px; gap:5px; }
  }
</style>
</head>
<body>
<h2 class="sr-only">Voice Companion：点中间的绿色按钮就能跟陈端倪实时语音通话。中央光球会随声音呼吸。</h2>

<canvas id="viz" aria-hidden="true"></canvas>

<button class="gear" id="gear" aria-label="设置">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
</button>

<div class="lamps" id="lamps" aria-label="系统健康状态">
  <span class="lamp" id="lamp-service"><i class="dot"></i>服务</span>

<script src="/yuling-assets/livekit-client.umd.js"></script>
<script>
(function(){
  const LK = window.LivekitClient;
  const $ = id => document.getElementById(id);
  const statusEl=$('status');
  const callBtn=$('callBtn'), callCircle=$('callCircle'), callIcon=$('callIcon'), callLabel=$('callLabel');
  const muteBtn=$('muteBtn'), muteCircle=$('muteCircle'), muteLabel=$('muteLabel');
  const gear=$('gear'), panel=$('panel');
  const callPanes=[$('callTop'), $('callStage'), $('callControls'), $('verLink')];
  const meetingView=$('meetingView'), swipeHint=$('swipeHint');
  const meetingStatus=$('meetingStatus'), meetingBadge=$('meetingBadge'), meetingTimer=$('meetingTimer');
  const meetingChunkMeta=$('meetingChunkMeta'), meetingDraftState=$('meetingDraftState');
  const meetingChunkRail=$('meetingChunkRail'), meetingFormalBtn=$('meetingFormalBtn');
  const meetingBody=$('meetingBody'), meetingExpandBtn=$('meetingExpandBtn');
  const meetingTransportBar=$('meetingTransportBar'), meetingTransportBadge=$('meetingTransportBadge');
  const meetingTransportDetail=$('meetingTransportDetail');
  const meetingRecordBtn=$('meetingRecordBtn'), meetingRecordLabel=$('meetingRecordLabel');
  const meetingPauseBtn=$('meetingPauseBtn'), meetingDiscardBtn=$('meetingDiscardBtn');
  const meetingSaveAudioToggle=$('meetingSaveAudioToggle');
  const meetingWave=$('meetingWave'), meetingWaveCtx=meetingWave.getContext('2d');

  let room=null, connecting=false, muted=false, currentCallId='';
  const MEETING_ENABLED=false; // Call POC: keep the original recorder code, disable its UI and gestures.
  const API_ROOT=(location.protocol==='file:')
    ? 'http://127.0.0.1:8080'
    : (location.port==='3000' ? `${location.protocol}//${location.hostname}:8080` : '');
  const apiUrl=path=>`${API_ROOT}${path}`;
  let meetingProgress=0;
  let meetingDrag=null;
  let meetingHistory=[];
  let meetingTranscriptExpanded=false;
  const NOTE_ROLLUP_MS=60000;
  const STREAM_SAMPLE_RATE=16000;
  const meetingRec={
    stream:null, recorder:null, mimeType:'audio/pcm', segments:[], isRecording:false, isPaused:false,
    startAt:0, pausedMs:0, pauseAt:0, segmentStartMs:0, raf:0, analyser:null, source:null, audioCtx:null,
    sessionId:'', liveSlices:[], minuteNotes:[], nextMinuteIndex:1,
    minuteUploading:false,
    saveAudio:false, processor:null, silentGain:null, pcmQueue:[], pcmUploading:false, pcmCursorMs:0,
    streamReader:null, streamAbort:null, streamBuffer:'', streamConnected:false,
    speechRec:null, speechSupported:false, speechRunning:false, interimText:'', lastFinalMs:0, speechError:'',
    backendLiveActive:false, fallbackTimer:0,
    speechStartedAt:0, speechLastEventAt:0, speechCycleTimer:0,
    formalizing:false, formalizedAt:0,
    streamState:'idle', streamStateNote:'录音开始后，这里会显示后端字幕、重连或备援逐字的真实状态。', streamStateAt:0, streamEvents:[]
  };
  const SPEECH_RECYCLE_MS=45000;
  const SPEECH_STALL_MS=8000;

  function setMeetingProgress(next, animate){
    if(!MEETING_ENABLED) next=0;
    meetingProgress=Math.max(0,Math.min(1,next||0));
    const shift=Math.round(innerWidth*0.54*meetingProgress);
    callPanes.forEach(el=>{
      if(!el) return;
      el.style.transition=animate===false?'none':'';
      el.style.transform=`translate3d(${shift}px,0,0)`;
      el.style.opacity=String(1-meetingProgress*0.78);
      el.style.pointerEvents=meetingProgress>0.82?'none':'';
    });
    if(meetingView){
      meetingView.style.transition=animate===false?'none':'';
      const x=Math.round((-1+meetingProgress)*Math.min(innerWidth*0.94, 560));
      meetingView.style.transform=`translate3d(${x}px,0,0)`;
      meetingView.style.opacity=String(Math.max(0,meetingProgress));
      meetingView.classList.toggle('open',meetingProgress>0.02);
      meetingView.style.pointerEvents=meetingProgress>0.02?'auto':'none';
    }
    if(swipeHint) swipeHint.classList.toggle('hide', false);
    refreshSwipeHint();
  }
  function refreshSwipeHint(){
    if(!swipeHint) return;
    const isOpen=meetingProgress>0.5;
    swipeHint.textContent=isOpen?'向左滑关闭录音':'向右滑开启录音';
    swipeHint.setAttribute('aria-label', isOpen?'关闭录音同时做记录':'开启录音同时做记录');
    swipeHint.setAttribute('aria-pressed', isOpen?'true':'false');
    swipeHint.title=isOpen?'点一下也可关闭录音':'点一下也可开启录音';
  }
  function openMeetingView(){ if(MEETING_ENABLED) setMeetingProgress(1,true); }
  function closeMeetingView(){ setMeetingProgress(0,true); }
  function toggleMeetingView(){
    if(!MEETING_ENABLED) return;
    if(meetingProgress>0.5) closeMeetingView();
    else openMeetingView();
  }
  function setMeetingTranscriptExpanded(expanded){
    meetingTranscriptExpanded=!!expanded;
    if(meetingBody) meetingBody.classList.toggle('expanded', meetingTranscriptExpanded);
    if(meetingExpandBtn){
      meetingExpandBtn.setAttribute('aria-pressed', meetingTranscriptExpanded ? 'true' : 'false');
      meetingExpandBtn.setAttribute('aria-label', meetingTranscriptExpanded ? '收起录音转文字区' : '放大录音转文字区');
      meetingExpandBtn.textContent=meetingTranscriptExpanded ? '⤡' : '⤢';
    }
  }
  function toggleMeetingTranscriptExpanded(){
    setMeetingTranscriptExpanded(!meetingTranscriptExpanded);
  }
  function activeOverlayOpen(){
    return [panel, $('logPanel'), $('innerPanel'), $('verPanel')].some(el=>el && !el.classList.contains('hidden'));
  }
  function fmtClock(ms){
    const total=Math.max(0,Math.floor(ms/1000));
    const m=String(Math.floor(total/60)).padStart(2,'0');
    const s=String(total%60).padStart(2,'0');
    return `${m}:${s}`;
  }
  function meetingElapsedMs(){
    if(!meetingRec.isRecording) return 0;
    const now=meetingRec.isPaused ? meetingRec.pauseAt : performance.now();
    return Math.max(0, now-meetingRec.startAt-meetingRec.pausedMs);
  }
  function segmentRangeText(startMs,endMs){
    return `${fmtClock(startMs)} - ${fmtClock(endMs)}`;
  }
  function meetingDisplaySlices(){
    return meetingRec.liveSlices
      .filter(slice=>slice && slice.transcript)
      .map(slice=>({
        ...slice,
        transcript:String(slice.transcript||'').trim(),
      }))
      .filter(slice=>slice.transcript);
  }
  function meetingBackendSlices(){
    return meetingDisplaySlices().filter(slice=>slice.source==='backend');
  }
  function buildMeetingWrapup(){
    const lines=(meetingRec.minuteNotes.length
      ? meetingRec.minuteNotes.map(note=>note.summary||note.transcript||'')
      : meetingBackendSlices().map(slice=>slice.transcript||'')).filter(Boolean);
    if(!lines.length) return '';
    return lines.slice(0,4).join(' ').slice(0,260);
  }
  function meetingFormalSummary(){
    const notes=meetingRec.minuteNotes
      .map(note=>(note.summary||note.transcript||'').trim())
      .filter(Boolean);
    if(notes.length) return notes.join(' ').slice(0,220);
    return buildMeetingWrapup();
  }
  function getMeetingLoopState(){
    const elapsed=meetingElapsedMs();
    const hasNotes=meetingRec.minuteNotes.some(note=>(note.summary||note.transcript||'').trim());
    const noteUploading=meetingRec.minuteNotes.some(note=>note.uploading && !note.done);
    const ready=!!meetingFormalSummary();
    if(meetingRec.formalizing) return {phase:'working', label:'整理中', status:'陈端倪正在整理会议记录', canFormalize:false, ready};
    if(meetingRec.formalizedAt) return {phase:'done', label:'已产出', status:'正式会议已产出，已收进历史会议记录。', canFormalize:ready, ready};
    if(noteUploading) return {phase:'working', label:'整理中', status:'陈端倪正在整理会议记录', canFormalize:false, ready};
    if(!hasNotes) return {phase:'working', label:'整理中', status:'陈端倪正在整理会议记录', canFormalize:false, ready:false};
    return {phase:'working', label:'整理中', status:'陈端倪正在整理会议记录', canFormalize:true, ready};
  }
  async function finalizeMeetingFormalNotes(){
    const loop=getMeetingLoopState();
    if(!loop.canFormalize || meetingRec.formalizing) return;
    if(!meetingRec.sessionId) return;
    meetingRec.formalizing=true;
    setMeetingUi();
    try{
      const summary=meetingFormalSummary();
      const preview=meetingBackendSlices()
        .map(slice=>slice.transcript||'')
        .filter(Boolean)
        .join(' ')
        .slice(0,180);
      const res=await fetch(apiUrl('/api/yuling/meetings/finalize'),{
        method:'POST',
        headers:Object.assign({'Content-Type':'application/json'},logHeaders()),
        body:JSON.stringify({
          session_id:meetingRec.sessionId,
          summary,
          transcript_preview:preview
        })
      });
      if(!res.ok) throw new Error('finalize '+res.status);
      const data=await res.json();
      meetingRec.formalizedAt=Date.parse(data.formalized_at||'') || Date.now();
      await loadMeetingHistory();
    }finally{
      meetingRec.formalizing=false;
      setMeetingUi();
    }
  }
  function speechCtor(){
    return window.SpeechRecognition || window.webkitSpeechRecognition || null;
  }
  function escHtml(s){
    return String(s||'').replace(/[&<>\"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[ch]));
  }
  function appendMeetingTranscript(text, startMs, endMs, source){
    const clean=String(text||'').replace(/\s+/g,' ').trim();
    if(!clean) return null;
    const slice={
      index:meetingRec.liveSlices.length+1,
      startMs:Math.max(0, startMs||0),
      endMs:Math.max(0, endMs||0),
      blob:null,
      transcript:clean,
      done:true,
      uploading:false,
      error:'',
      source:source||'browser',
      minuteIndex:Math.floor(Math.max(0, startMs||0)/NOTE_ROLLUP_MS)+1
    };
    meetingRec.liveSlices.push(slice);
    return slice;
  }
  function downsampleMeetingBuffer(input, inputRate, outputRate){
    if(!input || !input.length) return new Float32Array(0);
    if(inputRate===outputRate) return input;
    const ratio=inputRate/outputRate;
    const newLength=Math.max(1,Math.round(input.length/ratio));
    const result=new Float32Array(newLength);
    let offset=0;
    for(let i=0;i<newLength;i++){
      const next=Math.min(input.length, Math.round((i+1)*ratio));
      let sum=0, count=0;
      for(let j=offset;j<next;j++){ sum += input[j]; count += 1; }
      result[i]=count ? (sum/count) : 0;
      offset=next;
    }
    return result;
  }
  function encodeMeetingPcm(input, inputRate){
    const down=downsampleMeetingBuffer(input, inputRate, STREAM_SAMPLE_RATE);
    const bytes=new Uint8Array(down.length*2);
    const view=new DataView(bytes.buffer);
    for(let i=0;i<down.length;i++){
      const sample=Math.max(-1,Math.min(1,down[i]));
      view.setInt16(i*2, sample<0 ? sample*0x8000 : sample*0x7fff, true);
    }
    return bytes;
  }
  function stopMeetingEventStream(){
    if(meetingRec.streamAbort){
      try{ meetingRec.streamAbort.abort(); }catch(_){}
    }
    meetingRec.streamAbort=null;
    meetingRec.streamReader=null;
    meetingRec.streamBuffer='';
  }
  function clearMeetingFallbackTimer(){
    if(meetingRec.fallbackTimer) clearTimeout(meetingRec.fallbackTimer);
    meetingRec.fallbackTimer=0;
  }
  function pushMeetingStreamEvent(state, note){
    const entry={
      state:String(state||'idle'),
      note:String(note||'').trim(),
      at:Date.now()
    };
    meetingRec.streamEvents.unshift(entry);
    if(meetingRec.streamEvents.length>8) meetingRec.streamEvents.length=8;
  }
  function setMeetingStreamState(state, note){
    const next=String(state||'idle');
    const detail=String(note||'').trim();
    if(meetingRec.streamState===next && meetingRec.streamStateNote===detail) return;
    meetingRec.streamState=next;
    meetingRec.streamStateNote=detail;
    meetingRec.streamStateAt=Date.now();
    pushMeetingStreamEvent(next, detail);
  }
  function meetingStreamUi(){
    const state=meetingRec.streamState||'idle';
    const map={
      idle:{label:'待命中', cls:'idle', detail:'录音开始后，这里会显示后端字幕、重连或备援逐字的真实状态。'},
      connecting:{label:'接通中', cls:'connecting', detail:'后端实时字幕正在建立长连接。'},
      'backend-open':{label:'后端已接通', cls:'connecting', detail:'后端字幕已在线，正在等第一段真正的语音。'},
      'backend-live':{label:'后端逐字中', cls:'backend-live', detail:'后端实时字幕正在跟著你的声音出字。'},
      'append-reconnect':{label:'重接中', cls:'append-reconnect', detail:'后端流刚断过一次，正在补开新线接回主路径。'},
      'stream-dead':{label:'串流中断', cls:'stream-dead', detail:'后端字幕流刚刚断线，正在等待重接或切到备援逐字。'},
      rollover:{label:'换流中', cls:'rollover', detail:'长会议到换流点，正在无缝接到下一条后端字幕流。'},
      'fallback-active':{label:'备援逐字中', cls:'fallback-active', detail:'目前先用这台装置的实时字幕顶住，后端恢复后会切回主路径。'},
      error:{label:'异常', cls:'error', detail:'实时字幕链路出现错误，需要看最近事件与后端记录。'},
      closed:{label:'已停止', cls:'closed', detail:'这段录音已停止；字幕与陈端倪作业停在目前内容。'}
    };
    const base=map[state]||map.idle;
    return {
      label:base.label,
      cls:base.cls,
      detail:meetingRec.streamStateNote || base.detail,
    };
  }
  function scheduleMeetingSpeechFallback(delayMs){
    clearMeetingFallbackTimer();
    meetingRec.fallbackTimer=setTimeout(()=>{
      meetingRec.fallbackTimer=0;
      if(!meetingRec.isRecording || meetingRec.isPaused) return;
      if(meetingRec.backendLiveActive || meetingRec.speechRunning) return;
      setMeetingStreamState('fallback-active', '后端实时字幕暂时没出字，先切到装置端逐字避免整片空白。');
      startMeetingSpeechRecognition();
      setMeetingUi();
    }, Math.max(0, Number(delayMs||0)));
  }
  function handleMeetingStreamEvent(rawType, payload){
    const type=rawType||'message';
    if(type==='status'){
      const status=(payload&&payload.status)||'';
      if(status==='stream-open'){
        const detail=(payload&&payload.base_start_ms)>0
          ? `后端字幕已重接，从 ${fmtClock(payload.base_start_ms||0)} 接回主路径。`
          : '后端实时字幕已接通，正在等第一段真正的语音。';
        setMeetingStreamState('backend-open', detail);
      }else if(status==='append-reconnect'){
        meetingRec.backendLiveActive=false;
        setMeetingStreamState('append-reconnect', '后端流刚断过一次，正在补开新线接回主路径。');
      }else if(status==='stream-dead'){
        meetingRec.backendLiveActive=false;
        const reason=(payload&&payload.reason)||'';
        setMeetingStreamState('stream-dead', reason ? `后端字幕流中断：${reason}` : '后端字幕流中断，正在等待重接或备援逐字。');
        scheduleMeetingSpeechFallback(120);
      }else if(status==='rollover'){
        meetingRec.backendLiveActive=false;
        setMeetingStreamState('rollover', '长会议到换流点，正在接下一条后端字幕流。');
      }
      setMeetingUi();
      return;
    }
    if(type==='interim'){
      meetingRec.backendLiveActive=true;
      clearMeetingFallbackTimer();
      setMeetingStreamState('backend-live', '后端实时字幕正在跟著你的声音出字。');
      meetingRec.interimText=(payload&&payload.transcript)||'';
      setMeetingUi();
      return;
    }
    if(type==='final'){
      meetingRec.backendLiveActive=true;
      clearMeetingFallbackTimer();
      setMeetingStreamState('backend-live', '后端实时字幕正在稳定吐字。');
      meetingRec.interimText='';
      appendMeetingTranscript((payload&&payload.transcript)||'', payload&&payload.start_ms, payload&&payload.end_ms, 'backend');
      meetingRec.lastFinalMs=Math.max(meetingRec.lastFinalMs||0, (payload&&payload.end_ms)||0);
      maybeRollMeetingMinute(false);
      setMeetingUi();
      return;
    }
    if(type==='error'){
      meetingRec.backendLiveActive=false;
      meetingRec.speechError=(payload&&payload.message)||'stream-error';
      setMeetingStreamState('error', `后端字幕错误：${meetingRec.speechError}`);
      scheduleMeetingSpeechFallback(120);
      setMeetingUi();
      return;
    }
    if(type==='closed'){
      meetingRec.backendLiveActive=false;
      meetingRec.interimText='';

  function processMeetingEventBuffer(){

    while(boundary>=0){
      const block=meetingRec.streamBuffer.slice(0,boundary);
      meetingRec.streamBuffer=meetingRec.streamBuffer.slice(boundary+2);
      let eventType='message';
      let dataText='';
      block.split('\n').forEach(line=>{
        if(line.startsWith('event:')) eventType=line.slice(6).trim();
        else if(line.startsWith('data:')) dataText += line.slice(5).trim();
      });
      if(dataText){
        try{ handleMeetingStreamEvent(eventType, JSON.parse(dataText)); }
        catch(_){}

  async function startMeetingEventStream(sessionId){

        headers:logHeaders(),
        signal:controller.signal,

      if(!res.ok || !res.body) throw new Error('events '+res.status);
      meetingRec.streamConnected=true;
      setMeetingStreamState('connecting', '后端事件流已连上，正在等字幕事件开始进来。');
      const reader=res.body.getReader();
      const decoder=new TextDecoder();
      meetingRec.streamReader=reader;
      while(true){
        const {done,value}=await reader.read();
        if(done) break;
        meetingRec.streamBuffer += decoder.decode(value, {stream:true});
        processMeetingEventBuffer();
      }
    }catch(err){
      if(controller.signal.aborted) return;
      meetingRec.streamConnected=false;
      meetingRec.backendLiveActive=false;

  async function flushMeetingPcmQueue(){
    if(meetingRec.pcmUploading || !meetingRec.pcmQueue.length || !meetingRec.sessionId) return;
    const next=meetingRec.pcmQueue[0];
    meetingRec.pcmUploading=true;
    try{
      const res=await fetch(apiUrl(`/api/yuling/meetings/stream/${encodeURIComponent(meetingRec.sessionId)}/append`),{
        method:'POST',
        headers:Object.assign({
          'Content-Type':'application/octet-stream',
          'X-Start-Ms':String(next.startMs),
          'X-End-Ms':String(next.endMs),
        },logHeaders()),
        body:next.bytes,
      });
      if(!res.ok){
        let detail='append '+res.status;
        try{
          const data=await res.json();
          if(data && data.error) detail += ' '+ String(data.error);
        }catch(_){}
        throw new Error(detail);
      }
      meetingRec.pcmQueue.shift();
    }catch(err){
      next.tries=(next.tries||0)+1;
      if(next.tries>3){
        meetingRec.pcmQueue.shift();
        meetingRec.speechError=String((err&&err.message)||err||'append-failed');
        setMeetingStreamState('error', `送音讯到后端失败：${meetingRec.speechError}`);
      }
      if(next.tries>=2 && !meetingRec.backendLiveActive && !meetingRec.speechRunning){
        setMeetingStreamState('fallback-active', '后端音讯追加不稳，先切到装置端逐字避免整片空白。');
        startMeetingSpeechRecognition();

  function queueMeetingPcm(bytes, startMs, endMs){

    silentGain.gain.value=0;
    meetingRec.source.connect(processor);
    processor.connect(silentGain);
    silentGain.connect(ac.destination);

    meetingRec.silentGain=silentGain;

  function startMeetingSpeechRecognition(){
    const Ctor=speechCtor();
    meetingRec.speechSupported=!!Ctor;
    if(!Ctor || !meetingRec.isRecording || meetingRec.isPaused) return false;
    stopMeetingSpeechRecognition(false);
    const rec=new Ctor();
    rec.lang='zh-CN';
    rec.continuous=true;
    rec.interimResults=true;
    rec.maxAlternatives=1;
    meetingRec.speechStartedAt=performance.now();
    meetingRec.speechLastEventAt=meetingRec.speechStartedAt;
    rec.onresult=(event)=>{
      meetingRec.speechLastEventAt=performance.now();
      let interim=[];
      for(let i=event.resultIndex;i<event.results.length;i++){
        const part=((event.results[i]||[{}])[0]||{}).transcript||'';
        const text=String(part).replace(/\s+/g,' ').trim();
        if(!text) continue;
        if(event.results[i].isFinal){
          const endMs=meetingElapsedMs();
          const startMs=meetingRec.lastFinalMs || Math.max(0,endMs-1800);
          appendMeetingTranscript(text, startMs, endMs, 'browser');
          meetingRec.lastFinalMs=endMs;

      rec.start();

      meetingRec.speechRunning=true;
      meetingRec.speechError='';
      meetingRec.speechSupported=true;
      if(!meetingRec.backendLiveActive) setMeetingStreamState('fallback-active', '目前先用这台装置的实时字幕顶住，等后端恢复会切回主路径。');

    }

  function maybeRollMeetingMinute(force){
    const elapsed=meetingElapsedMs();
    if(force && elapsed<NOTE_ROLLUP_MS){
      return;

    const eligibleMinute=force
      ? Math.ceil(Math.max(0, elapsed)/NOTE_ROLLUP_MS)
      : Math.floor(Math.max(0, elapsed-5000)/NOTE_ROLLUP_MS);
    while(meetingRec.nextMinuteIndex<=eligibleMinute){
      const minuteIndex=meetingRec.nextMinuteIndex;
      const startMs=(minuteIndex-1)*NOTE_ROLLUP_MS;
      const endMs=Math.min(force ? elapsed : minuteIndex*NOTE_ROLLUP_MS, elapsed);
      const slicesForMinute=meetingBackendSlices().filter(slice=>slice.minuteIndex===minuteIndex);
      const pendingForMinute=slicesForMinute.some(slice=>!slice.done && !slice.error);
      const transcript=meetingBackendSlices()
        .filter(slice=>slice.done && !slice.error && slice.minuteIndex===minuteIndex && slice.transcript)
        .map(slice=>slice.transcript.trim())
        .filter(Boolean)
        .join(' ')
        .trim();
      if(!force && pendingForMinute){
        return;
      }
      if(transcript){
        const note={

          startMs,
          endMs,
          transcript,
          summary:'',
          uploading:false,

  function setStatus(t){ statusEl.textContent=t; }

  let agentState='', agentStateAt=0, lastUserVoiceAt=0, lastBaoVoiceAt=0;

  function checkStandbyReason(){

  const motionFX={bound:false,enabled:false,x:0,y:0,tx:0,ty:0,shake:0,lastShake:0,

  const MOTION_HUES=[0,28,54,120,210,246,285];
  const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
  function pickMotionHue(){
    let next=MOTION_HUES[(Math.random()*MOTION_HUES.length)|0];
    if(MOTION_HUES.length>1 && next===motionFX.hue) next=MOTION_HUES[(MOTION_HUES.indexOf(next)+1)%MOTION_HUES.length];

  async function enableMotionFX(){

      }
      if(typeof DeviceMotionEvent!=='undefined' &&
         typeof DeviceMotionEvent.requestPermission==='function'){
        permissions.push(DeviceMotionEvent.requestPermission());
      }

  let micCalc=null, baoCalc=null;   // 实时声浪 0..1 (track 就绪才接)

  // 每只取领头历史上的一个过去点(age=延迟) + 侧向偏移(往尾巴变宽=V) → 自然彗星尾。
  const FN = innerWidth<700 ? 420 : 760;
  const fage=new Float32Array(FN), flat=new Float32Array(FN),

    lvy = lvy*0.85 + Math.sin(lhead)*spd*0.15;
    const cpull = gv>0.04 ? 0.003 : 0.03;                     // 有声弱回中; 静止→慢慢回正中央
    lvx += (cxp-lx)*cpull; lvy += (cyp-ly)*cpull;
    lx+=lvx; ly+=lvy;
    hidx=(hidx+1)%HIST; hx[hidx]=lx; hy[hidx]=ly;             // 推进领头轨迹
    const trail=220;                                          // 尾巴长度(帧)
    for(let i=0;i<FN;i++){
      const back=(fage[i]*trail)|0;
      const j=(hidx-back+HIST)%HIST, j2=(j-3+HIST)%HIST;
      let dx=hx[j]-hx[j2], dy=hy[j]-hy[j2];
      const dl=Math.sqrt(dx*dx+dy*dy)||1; dx/=dl; dy/=dl;     // 该轨迹点的行进方向
      const cone=R*(0.04+fage[i]*1.25);                       // 越往尾巴越宽 → V 扩散
      const px=hx[j] + (-dy)*flat[i]*cone, py=hy[j] + dx*flat[i]*cone;
      const tw=0.2+0.8*(0.5+0.5*Math.sin(t*6.2832/fper[i]+fph[i]));  // 一闪一闪 1/2/3 秒
      cx.fillStyle=`hsla(${hue},${sat+10}%,${lit+16}%,${(0.1+gv*0.3)*tw})`;
      cx.fillRect(px, py, DPR*fsz[i]*1.4, DPR*fsz[i]*1.4);
    }

    // 涟漪 (极淡细圈)
    if(vol>0.18 && ts-lastRip>Math.max(220,560-vol*380)){ ripples.push({r:R*1.05,a:0.08+vol*0.13}); lastRip=ts; }
    for(let i=ripples.length-1;i>=0;i--){ const rp=ripples[i]; rp.r+=DPR*(1.6+vol*5.5); rp.a*=0.968;
      if(rp.a<0.012){ ripples.splice(i,1); continue; }
      cx.strokeStyle=`hsla(${hue},${sat}%,${lit+8}%,${rp.a})`; cx.lineWidth=DPR*0.6;
      cx.beginPath(); cx.arc(cxp,cyp,rp.r,0,6.2832); cx.stroke(); }

    cx.globalCompositeOperation='source-over';
    requestAnimationFrame(vizFrame);
  }

  // 从 LiveKit track 取实时声浪 (0..1)。优先用 LK 内建, 退 Web Audio。
  function makeVol(track){
    try{
      if(LK.createAudioAnalyser){
        const a=LK.createAudioAnalyser(track,{cloneTrack:true,fftSize:256});
        return a.calculateVolume;
      }
    }catch(_){}
    try{
      const mst=track.mediaStreamTrack||(track.mediaStream&&track.mediaStream.getAudioTracks()[0]);
      if(!mst) return null;
      const AC=window.AudioContext||window.webkitAudioContext;
      const ac=window._yac||(window._yac=new AC());
      if(ac.state==='suspended') ac.resume();
      const src=ac.createMediaStreamSource(new MediaStream([mst]));
      const an=ac.createAnalyser(); an.fftSize=256; src.connect(an);
      const buf=new Uint8Array(an.frequencyBinCount);
      return ()=>{ an.getByteFrequencyData(buf); let s=0; for(let i=0;i<buf.length;i++)s+=buf[i]; return s/buf.length/255; };
    }catch(_){ return null; }
  }

  function resizeMeetingWave(){
    const rect=meetingWave.getBoundingClientRect();
    const dpr=Math.min(window.devicePixelRatio||1,2);
    meetingWave.width=Math.max(240,Math.round(rect.width*dpr));
    meetingWave.height=Math.max(100,Math.round(rect.height*dpr));
  }
  function drawMeetingWave(){
    const ctx=meetingWaveCtx, w=meetingWave.width, h=meetingWave.height;
    ctx.clearRect(0,0,w,h);
    const now=performance.now();
    const bins=84, ampBase=h*0.32;
    const arr=meetingRec.analyser ? new Uint8Array(meetingRec.analyser.frequencyBinCount) : null;
    if(arr) meetingRec.analyser.getByteFrequencyData(arr);
    const samples=[];
    for(let i=0;i<=bins;i++){
      let sample=0;
      if(arr){
        const stride=Math.max(1,Math.floor(arr.length/bins));
        const start=Math.min(arr.length-1,i*stride);
        let sum=0;
        for(let j=0;j<stride && start+j<arr.length;j++) sum+=arr[start+j];
        sample=(sum/Math.max(1,stride))/255;
      }else{
        sample=0.14+0.08*Math.sin((now/700)+(i*0.35));
      }
      sample=Math.min(1, Math.pow(Math.max(0, sample), 0.42)*2.9);
      samples.push(sample);
    }
    const layers=[
      { hue:190, alpha:0.38, width:Math.max(2.1,w/280), speed:620, offset:0.0, lift:-0.16, blur:14 },
      { hue:285, alpha:0.34, width:Math.max(2.0,w/300), speed:760, offset:1.3, lift:0.0, blur:16 },
      { hue:325, alpha:0.31, width:Math.max(1.9,w/320), speed:540, offset:2.2, lift:0.16, blur:14 },
    ];
    const centerY=h/2;
    ctx.globalCompositeOperation='lighter';
    layers.forEach(layer=>{
      ctx.beginPath();
      for(let i=0;i<=bins;i++){
        const x=w*(i/bins);
        const wave=Math.sin((now/layer.speed)+(i*0.42)+layer.offset)*0.65
          + Math.sin((now/(layer.speed*0.66))+(i*0.19)+layer.offset*1.7)*0.35;
        const cloud=Math.exp(-Math.pow((i-bins/2)/(bins*0.28),2));
        const pulse=1.8+samples[i]*8.9;
        const y=centerY + layer.lift*h + wave*ampBase*pulse*cloud;
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.strokeStyle=`hsla(${layer.hue},85%,68%,${layer.alpha})`;
      ctx.lineWidth=layer.width;
      ctx.lineCap='round';
      ctx.shadowBlur=layer.blur;
      ctx.shadowColor=`hsla(${layer.hue},90%,70%,${layer.alpha*1.4})`;
      ctx.stroke();
    });
    ctx.shadowBlur=0;
    const glow=ctx.createRadialGradient(w/2,h/2,0,w/2,h/2,h*0.6);
    glow.addColorStop(0,'rgba(255,255,255,0.10)');
    glow.addColorStop(.45,'rgba(95,165,255,0.08)');
    glow.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=glow;
    ctx.fillRect(0,0,w,h);
    ctx.globalCompositeOperation='source-over';
    meetingRec.raf=requestAnimationFrame(drawMeetingWave);
  }

  const audioEventFX={timer:null,baseline:0.015,last:{},bound:false};
  function classifyAudioEvent(rms,peak,highRatio,zcr){
    if(peak>0.82 && rms>audioEventFX.baseline*5) return {label:'impact', confidence:Math.min(0.95, peak)};
    if(rms>0.16 && peak>0.62 && highRatio>0.30) return {label:'sneeze', confidence:Math.min(0.92, 0.55+rms+highRatio*.5)};
    if(rms>0.09 && peak>0.36 && highRatio>0.16 && zcr>0.05) return {label:'cough', confidence:Math.min(0.88, 0.48+rms+highRatio*.45)};
    return null;
  }
  function postAudioEvent(evt, metrics){
    if(!currentCallId || !evt) return;
    const now=performance.now();
    if(now-(audioEventFX.last[evt.label]||0)<2600) return;
    audioEventFX.last[evt.label]=now;
    fetch(apiUrl('/api/yuling/calls/'+encodeURIComponent(currentCallId)+'/event'),{
      method:'POST',
      headers:Object.assign({'Content-Type':'application/json'},logHeaders()),
      body:JSON.stringify({label:evt.label,confidence:evt.confidence,meta:Object.assign({source:'browser-heuristic'},metrics)})
    }).catch(()=>{});
  }
  function bindAudioEventDetector(track){
    try{
      if(audioEventFX.timer) clearInterval(audioEventFX.timer);
      const mst=track.mediaStreamTrack||(track.mediaStream&&track.mediaStream.getAudioTracks()[0]);
      if(!mst) return;
      const AC=window.AudioContext||window.webkitAudioContext;
      const ac=window._yac||(window._yac=new AC());
      if(ac.state==='suspended') ac.resume();
      const src=ac.createMediaStreamSource(new MediaStream([mst]));
      const an=ac.createAnalyser(); an.fftSize=2048; src.connect(an);
      const td=new Float32Array(an.fftSize), fd=new Uint8Array(an.frequencyBinCount);
      audioEventFX.timer=setInterval(()=>{
        an.getFloatTimeDomainData(td); an.getByteFrequencyData(fd);
        let sum=0, peak=0, crossings=0;
        for(let i=0;i<td.length;i++){
          const v=Math.abs(td[i]); sum+=td[i]*td[i]; if(v>peak) peak=v;
          if(i>0 && ((td[i]>=0)!=(td[i-1]>=0))) crossings++;
        }
        const rms=Math.sqrt(sum/td.length), zcr=crossings/td.length;
        let high=0,total=1;
        for(let i=0;i<fd.length;i++){ total+=fd[i]; if(i>fd.length*.42) high+=fd[i]; }
        const highRatio=high/total;
        audioEventFX.baseline=audioEventFX.baseline*.96+Math.min(rms,0.08)*.04;
        const evt=classifyAudioEvent(rms,peak,highRatio,zcr);
        if(evt) postAudioEvent(evt,{rms:+rms.toFixed(4),peak:+peak.toFixed(4),highRatio:+highRatio.toFixed(3),zcr:+zcr.toFixed(3)});
      },260);
      audioEventFX.bound=true;
    }catch(_){}
  }

  function boostRemoteAudio(track, attachedEl){
    try{
      const mst=track.mediaStreamTrack||(track.mediaStream&&track.mediaStream.getAudioTracks()[0]);
      if(!mst) return false;
      const AC=window.AudioContext||window.webkitAudioContext;
      const ac=window._yac||(window._yac=new AC());
      if(ac.state==='suspended') ac.resume();
      const src=ac.createMediaStreamSource(new MediaStream([mst]));
      const gain=ac.createGain();
      gain.gain.value=1.65;
      src.connect(gain); gain.connect(ac.destination);
      boostedAudioNodes.push({src,gain});
      if(attachedEl) attachedEl.muted=true;
      return true;
    }catch(_){ return false; }
  }

  function setLamp(id, state){
    const el=$('lamp-'+id); if(!el) return;
    el.classList.remove('ok','bad','warn');
    if(state) el.classList.add(state);
    const meanings={
      service:{ok:'Railway API 已回应',bad:'Railway API 无法回应'},
      mic:{ok:'麦克风已启用',bad:'麦克风无法启用',warn:'麦克风已静音'},
      livekit:{ok:'已加入 LiveKit 房间',bad:'无法连接 LiveKit 房间或缺少设置',warn:'正在连接 LiveKit 房间'},
      agent:{ok:'语灵 Agent 已加入房间',bad:'语灵 Agent 无法加入房间',warn:'等待语灵 Agent 加入'},
      audio:{ok:'已收到远端音轨',bad:'未能收到远端音轨',warn:'等待远端音轨'},
      stt:{ok:'本次已收到你的语音转写',warn:'等待本次语音转写'},
      llm:{warn:'当前无法独立验证 LLM 响应'},
      tts:{ok:'本次已检测到代理语音输出；未独立检测供应商',warn:'等待本次代理语音输出'}
    };
    const label=el.textContent.trim();
    const meaning=(meanings[id]&&meanings[id][state])||'尚未开始测试';
    el.setAttribute('aria-label',`${label}：${meaning}`);
    el.title=`${label}：${meaning}`;
  }

  const ringback=new Audio(); ringback.loop=true; ringback.volume=0.55;

  async function startCall(){
    if(connecting||room) return;
    connecting=true; setStatus('拨号中…'); callLabel.textContent='连接中';
    setLamp('livekit','warn'); setLamp('agent','warn'); setLamp('audio','');
    setLamp('stt','warn'); setLamp('llm','warn'); setLamp('tts','warn');
    muteBtn.classList.add('show');   // 连接中→静音钮慢慢从挂断球长出来
    ringback.currentTime=0; ringback.play().catch(()=>{});   // 开始播等待接听音效
    try{
      const res=await fetch(apiUrl('/api/yuling/token'),{
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ identity:'coach', name:'使用者' })
      });
      if(res.status===403){ stopRing(); setStatus('通话权限未开放'); uiIdle(); return; }
      if(!res.ok){ stopRing(); setStatus('通话服务无法签发凭证（'+res.status+'）'); setLamp('livekit','bad'); uiIdle(); return; }
      const d=await res.json();
      currentCallId=d.room||'';

      room=new LK.Room({ adaptiveStream:true, dynacast:true });
      room.on(LK.RoomEvent.TranscriptionReceived,(segments,participant)=>{
        if(participant && participant.identity===room.localParticipant.identity &&
           segments && segments.some(s=>s.final && String(s.text||'').trim())) setLamp('stt','ok');
      });
      room.on(LK.RoomEvent.TrackSubscribed,(track)=>{
        if(track.kind===LK.Track.Kind.Audio){
          setLamp('audio','ok');
          stopRing();                       // 陈端倪接听了 → 停等待铃声
          const el=track.attach(); el.autoplay=true; el.playsInline=true;
          el.style.display='none'; document.body.appendChild(el);
          el.play&&el.play().catch(()=>{});
          boostRemoteAudio(track, el);
          baoCalc=makeVol(track);          // 陈端倪发声 → 光球反应
        }
      });
      room.on(LK.RoomEvent.ParticipantConnected,(p)=>{
        setLamp('agent','ok');
        const s=p&&p.attributes&&p.attributes['lk.agent.state'];
        if(s) applyAgentState(s); else setStatus('通话中');
      });
      room.on(LK.RoomEvent.ParticipantDisconnected,()=>setLamp('agent','warn'));
      room.on(LK.RoomEvent.ParticipantAttributesChanged,(changed,participant)=>{
        const s=changed&&changed['lk.agent.state'];
        if(s) applyAgentState(s);
      });
      room.on(LK.RoomEvent.Disconnected,()=>{ cleanup('已挂断'); });

      await room.connect(d.url, d.token);
      setLamp('livekit','ok');
      try{
        await room.localParticipant.setMicrophoneEnabled(true);
        setMic('ok');
        const mp=room.localParticipant.getTrackPublication(LK.Track.Source.Microphone);
        if(mp&&mp.track){
          micCalc=makeVol(mp.track);   // 你发声 → 光球反应
          bindAudioEventDetector(mp.track);
        }
      }catch(micErr){
        setMic('bad'); setStatus('麦克风被挡，请允许权限');
      }
      connecting=false; uiInCall();
      const others=room.numParticipants||0;
      setStatus(others>0?'通话中':'陈端倪接通中…');
      // 陈端倪已在房且已有状态 → 立刻反映 (避免错过第一个状态)
      try{ room.remoteParticipants.forEach(p=>{ setLamp('agent','ok'); const s=p.attributes&&p.attributes['lk.agent.state']; if(s) applyAgentState(s); }); }catch(_){}
    }catch(e){
      stopRing(); setStatus('出错了：'+(e&&e.message?e.message:e)); setLamp('livekit','bad'); uiIdle(); room=null;
    }
  }

    const wd='日一二三四五六'[new Date(+m[1],+m[2]-1,+m[3]).getDay()];

  function beginMeetingDrag(clientX, clientY, target){
    if(!MEETING_ENABLED) return;
    if(activeOverlayOpen()) return;
    const active=document.activeElement;
    if(active && /input|textarea|select/i.test(active.tagName||'')) return;
    if(target && target.closest && target.closest('button, a, input, textarea, select, canvas, [data-noswipe]')) return;
    meetingDrag={startX:clientX, startY:clientY, lastX:clientX, base:meetingProgress, axis:'pending'};
    setMeetingProgress(meetingProgress,false);
  }
  function moveMeetingDrag(clientX){
    if(!meetingDrag) return;
    meetingDrag.lastX=clientX;
    const delta=clientX-meetingDrag.startX;
    const width=Math.min(innerWidth*0.94, 560);
    const next=meetingDrag.base + (delta/Math.max(240,width));
    setMeetingProgress(next,false);
  }
  function endMeetingDrag(clientX){
    if(!meetingDrag) return;
    const delta=clientX-meetingDrag.startX;
    const shouldOpen=meetingProgress>0.5 || delta>72;
    meetingDrag=null;
    setMeetingProgress(shouldOpen?1:0,true);
  }
  function updateMeetingDrag(clientX, clientY){
    if(!meetingDrag) return false;
    const dx=clientX-meetingDrag.startX;
    const dy=clientY-meetingDrag.startY;
    if(meetingDrag.axis==='pending'){
      if(Math.abs(dx)<12 && Math.abs(dy)<12) return false;
      if(Math.abs(dx) > Math.abs(dy)+6){
        meetingDrag.axis='x';
      }else if(Math.abs(dy) >= Math.abs(dx)){
        meetingDrag=null;
        return false;
      }
    }
    if(meetingDrag.axis!=='x') return false;
    moveMeetingDrag(clientX);
    return true;
  }

  document.addEventListener('touchstart',e=>{
    if(!e.touches || e.touches.length!==1) return;
    const touch=e.touches[0];
    beginMeetingDrag(touch.clientX, touch.clientY, e.target);
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!meetingDrag || !e.touches || e.touches.length!==1) return;
    const touch=e.touches[0];

  },{passive:false});
  document.addEventListener('touchend',e=>{
    if(!meetingDrag) return;
    const touch=e.changedTouches && e.changedTouches[0];
    if(meetingDrag.axis==='x'){
      endMeetingDrag(touch ? touch.clientX : meetingDrag.lastX);
      return;
    }
    meetingDrag=null;
  },{passive:true});

  document.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse' && innerWidth>900) return;
    beginMeetingDrag(e.clientX, e.clientY, e.target);
  });
  document.addEventListener('pointermove',e=>{ updateMeetingDrag(e.clientX, e.clientY); });
  document.addEventListener('pointerup',e=>{
    if(!meetingDrag) return;
    if(meetingDrag.axis==='x'){
      endMeetingDrag(e.clientX);
      return;
    }
    meetingDrag=null;
  });
  document.addEventListener('pointercancel',()=>{
    if(!meetingDrag) return;
    const shouldOpen=meetingProgress>0.5;
    meetingDrag=null;
    setMeetingProgress(shouldOpen?1:0,true);
  });
  window.addEventListener('keydown',e=>{
    if(!MEETING_ENABLED) return;
    if(activeOverlayOpen()) return;
    if(e.key==='ArrowRight') openMeetingView();
    if(e.key==='ArrowLeft') closeMeetingView();
  });

  if(!LK){ setStatus('语音元件载入失败，请重新整理'); callBtn.disabled=true; }
  else uiIdle();

  setMeetingProgress(0,true);
  refreshSwipeHint();
  setMeetingUi();
  resizeMeetingWave();
  if(MEETING_ENABLED) loadMeetingHistory();
  window.addEventListener('resize',()=>{
    resizeMeetingWave();
    setMeetingProgress(meetingProgress,false);
  });
  if(MEETING_ENABLED) setInterval(tickMeetingRecording, 250);

  setMic('');                       // MIC 待机灰
  pollHealth();                     // 开机先点亮一次
  setInterval(pollHealth, 20000);   // 每 20 秒巡一次

  // 本地时钟 (跟陈端倪 prompt 同一套时间/时段, 视觉呈现)
  const clockEl=$('clock');
  function updateClock(){
    const t=new Date(Date.now()+ (new Date().getTimezoneOffset()*60000) + 8*3600000); // → UTC+8
    const h=t.getHours();
    const seg = h<5?'半夜':h<8?'清晨':h<11?'早上':h<13?'中午':h<17?'下午':h<19?'傍晚':h<23?'晚上':'半夜';
    const wd='日一二三四五六'[t.getDay()];
    const mm=String(t.getMinutes()).padStart(2,'0');
    clockEl.textContent=`${t.getFullYear()}/${t.getMonth()+1}/${t.getDate()} 周${wd} · ${seg} ${t.getHours()}:${mm}`;
  }
  updateClock(); setInterval(updateClock, 15000);
})();
</script>
</body>
</html>
