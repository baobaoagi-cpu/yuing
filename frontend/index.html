<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="Dunni" />
<title>YULING · 语灵通话</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" type="image/png" href="/assets/dunni-icon-v1-192.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/assets/dunni-icon-v1-180.png" />
<style>
  :root{ --ink:#000; --light:#fff; --dim:rgba(255,255,255,.55); --faint:rgba(255,255,255,.12);
         --live:#1d9e75; --warn:#d85a30; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:var(--ink); color:var(--light);
    font-family:-apple-system,"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    overscroll-behavior:none; }
  body{ display:flex; flex-direction:column; align-items:center; justify-content:space-between;
    padding:max(84px,calc(env(safe-area-inset-top) + 76px)) 24px max(8vh,40px); text-align:center; }
  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

  .top{ display:flex; flex-direction:column; align-items:center; gap:6px; }
  .top.callpane{ position:fixed; top:50%; left:0; right:0; z-index:3;
    transform:translateY(-50%); margin:0; pointer-events:none; }
  .top.callpane .clock,.top.callpane .name{ display:none; }
  .clock{ font-size:13px; color:var(--dim); letter-spacing:.06em; margin-bottom:4px; }
  .name{ font-size:26px; font-weight:500; letter-spacing:.08em; }
  .status{ font-size:15px; color:var(--dim); min-height:22px; letter-spacing:.04em; }

  #viz{ position:fixed; inset:0; width:100%; height:100%; z-index:2; pointer-events:none; }
  .emotion-stage{ position:fixed; right:0; bottom:0; z-index:1; width:min(100vw,56.25vh,500px);
    aspect-ratio:9/16; max-height:100vh; overflow:hidden; pointer-events:none; background:#000;
    transform:translate3d(var(--swipe-scene-x,0px),0,0); }
  .emotion-stage[hidden]{ display:none; }
  .emotion-stage video{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain;
    background:#000; pointer-events:none; }
  .emotion-stage video[hidden]{ display:none; }
  .emotion-stage.fallback{ background:#000 url('/yuling-media/chen-dunni-poster.jpg') center/contain no-repeat; }
  .emotion-stage.fallback video{ display:none; }
  .emotion-blackout{ position:absolute; inset:0; z-index:2; background:#000; opacity:0;
    transition:opacity .22s ease; }
  .emotion-blackout.opaque{ opacity:1; }
  /* The existing neutral fill is unchanged. Opacity, unlike a CSS gradient, interpolates smoothly. */
  body[data-emotion="happy"]{ --emotion-gradient:linear-gradient(145deg,#382719,#211d1a); --emotion-border:#9b7650; }
  body[data-emotion="curious"]{ --emotion-gradient:linear-gradient(145deg,#17352e,#192326); --emotion-border:#468d84; }
  body[data-emotion="unhappy"]{ --emotion-gradient:linear-gradient(145deg,#292b3d,#1c202a); --emotion-border:#717997; }
  body[data-emotion="sad"]{ --emotion-gradient:linear-gradient(145deg,#1a2b43,#191e2b); --emotion-border:#557da7; }
  body[data-emotion="angry"]{ --emotion-gradient:linear-gradient(145deg,#3b202b,#241b20); --emotion-border:#a45a71; }
  body[data-emotion="delighted"]{ --emotion-gradient:linear-gradient(145deg,#40291f,#251e1d); --emotion-border:#b97863; }
  body[data-emotion="playful_face"]{ --emotion-gradient:linear-gradient(145deg,#35233f,#211d2b); --emotion-border:#9169aa; }
  #dunni-portrait{ position:fixed; left:12px; top:calc(max(8px,env(safe-area-inset-top)) + 60px);
    z-index:3; pointer-events:none; display:block; width:56px; height:56px; border-radius:50%;
    object-fit:cover; border:1px solid rgba(255,255,255,.32); background:#111;
    user-select:none; -webkit-user-drag:none; }
  .live-dialogue{ position:fixed; inset:calc(max(8px,env(safe-area-inset-top)) + 60px) 12px
    calc(max(8vh,40px) + 178px); z-index:3; pointer-events:none; }
  .live-turn{ position:absolute; max-width:min(72vw,420px); display:flex; flex-direction:column;
    gap:5px; text-align:left; }
  .live-turn.agent{ left:68px; top:0; align-items:flex-start; }
  .live-turn.user{ right:64px; bottom:0; align-items:flex-end; text-align:right; }
  .live-speaker{ font-size:12px; color:#fff; }
  .live-bubble{ max-height:min(32vh,230px); overflow-y:auto; overflow-wrap:anywhere;
    padding:10px 14px; border-radius:16px; font-size:16px; line-height:1.55;
    color:#fff; background:rgba(20,20,20,.25); border:0;
    white-space:pre-wrap; scrollbar-width:thin; position:relative; isolation:isolate; }
  .live-turn.agent .live-bubble{ transition:border-color .35s ease; }
  .live-turn.agent .live-bubble::before{ content:""; position:absolute; inset:0;
    border-radius:inherit; background:var(--emotion-gradient,transparent); opacity:0;
    pointer-events:none; z-index:0; transition:opacity .35s ease; }
  body[data-emotion] .live-turn.agent .live-bubble{ border:1px solid var(--emotion-border); }
  body[data-emotion] .live-turn.agent .live-bubble::before{ opacity:1; }
  .live-bubble .live-text{ position:relative; z-index:1; }
  .live-turn.user .live-bubble{ background:rgba(24,42,56,.25); }
  .live-bubble.interim{ color:#fff; }
  .user-avatar{ position:fixed; right:12px; bottom:calc(max(8vh,40px) + 178px); z-index:3;
    width:56px; height:56px; display:grid; place-items:center; border-radius:50%;
    border:1px solid rgba(255,255,255,.32); background:#203041; color:#fff;
    font-size:18px; font-weight:600; }
  .stage{ flex:1; }
  .top, .controls{ position:relative; z-index:3; }
  .call-toolbar{ position:fixed; top:max(8px,env(safe-area-inset-top)); left:12px; right:12px;
    z-index:4; height:68px; display:grid; grid-template-columns:44px minmax(0,1fr) 44px;
    align-items:center; gap:5px; }
  .panel{ z-index:5; }

  .controls{ position:relative; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:18px; min-height:150px; }
  .btn{ border:none; background:none; color:var(--light); cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:8px; font-size:13px; color:var(--dim); }
  /* 静音钮过场: 待机缩在挂断球中心(scale.2/透明), 连接滑出左侧长大 */
  .mutefab{ position:absolute; left:50%; top:10px;
    transform:translateX(-50%) scale(.2); opacity:0; pointer-events:none;
    transition:transform .5s cubic-bezier(.34,1.25,.5,1), opacity .4s ease; }
  .mutefab.show{ transform:translateX(calc(-50% - 102px)) scale(1); opacity:1; pointer-events:auto; }
  .circle{ width:64px; height:64px; border-radius:50%; border:1px solid var(--faint);
    display:flex; align-items:center; justify-content:center; transition:background .2s, opacity .2s; }
  .circle svg{ width:26px; height:26px; }
  .btn:active .circle{ transform:scale(.94); }
  .call{ width:84px; height:84px; }
  .call.go{ background:var(--live); border-color:var(--live); }
  .call.end{ background:var(--warn); border-color:var(--warn); }
  .duplex-switch{ border:1px solid rgba(255,255,255,.19); border-radius:999px;
    background:rgba(10,18,14,.82); color:#a7d6bd; padding:7px 15px;
    font:inherit; font-size:12px; cursor:pointer; }
  .btn[disabled]{ opacity:.3; pointer-events:none; }
  .hidden{ display:none !important; }

  .nav-control{ display:grid; place-items:center;
    width:44px; height:44px; padding:0; border:1px solid rgba(255,255,255,.15);
    border-radius:12px; background:rgba(0,0,0,.56); color:rgba(255,255,255,.82);
    cursor:pointer; backdrop-filter:blur(8px); }
  .nav-control svg{ width:22px; height:22px; }
  .nav-control:hover{ border-color:rgba(255,255,255,.38); color:#fff; }
  .nav-control:focus-visible,.panel-close:focus-visible{ outline:2px solid #1d9e75; outline-offset:3px; }
  .chat-return{ grid-column:1; }
  .menu-toggle{ grid-column:3; }
  .panel-close{ position:absolute; top:max(4vh,18px); right:20px; display:grid; place-items:center;
    width:44px; height:44px; border:1px solid var(--faint); border-radius:12px;
    background:rgba(255,255,255,.04); color:var(--light); font-size:24px; cursor:pointer; }
  /* Only components observable on the deployed call path are shown. */
  .lamps{ grid-column:2; grid-row:1; min-width:0; display:grid;
    grid-template-columns:repeat(5,max-content); grid-auto-rows:minmax(15px,auto);
    align-content:center; justify-content:center; gap:2px 7px; white-space:nowrap; }
  .lamp{ display:flex; align-items:center; gap:2px; font-size:10px; color:var(--dim);
    letter-spacing:0; white-space:nowrap; flex:none; }
  .lamp .dot{ width:7px; height:7px; border-radius:50%; background:var(--faint);
    flex:none; transition:background .3s, box-shadow .3s; }
  .lamp.ok   .dot{ background:var(--live); box-shadow:0 0 9px rgba(29,158,117,.9); }
  .lamp.bad  .dot{ background:var(--warn); box-shadow:0 0 6px rgba(216,90,48,.7); }
  .lamp.warn .dot{ background:#e0a52e; box-shadow:0 0 6px rgba(224,165,46,.6); }
  .lamp.ok{ color:rgba(255,255,255,.8); }
  #meetingView,#swipeHint{ display:none !important; }
  #chatOverlay[hidden]{ display:none; }
  #chatSwipeFallback{ display:none; position:fixed; inset:0; z-index:7;
    transform:translate3d(var(--swipe-chat-x,0px),0,0);
    transition:transform .22s cubic-bezier(.22,.8,.24,1);
    background:#080a09; color:#f4f6f2; text-align:left; }
  body.swipe-chat-loading #chatSwipeFallback{ display:block; }
  #chatSwipeFallback::before{ content:'陈端倪'; display:block; height:67px; padding:19px 22px;
    border-bottom:1px solid #28342d; font-size:18px; font-weight:600; }
  #chatSwipeFallback span{ display:block; margin:30vh auto 0; text-align:center;
    color:#a4afa5; font-size:14px; }
  body.swipe-chat-loading #chatOverlay{ opacity:0; }
  #chatOverlay{ position:fixed; inset:0; width:100%; height:100%; z-index:8;
    border:0; background:transparent; transform:translate3d(var(--swipe-chat-x,0px),0,0);
    transition:transform .22s cubic-bezier(.22,.8,.24,1); will-change:transform; }
  #inCallBar{ transform:translate3d(var(--swipe-bar-x,0px),0,0);
    transition:transform .22s cubic-bezier(.22,.8,.24,1); }
  .call-toolbar{ touch-action:pan-y pinch-zoom; }
  .call-toolbar,#viz,#emotionStage,#dunni-portrait,#liveDialogue,#userAvatar,#callTop,#callStage,#callControls{
    transform:translate3d(var(--swipe-scene-x,0px),0,0);
    transition:transform .22s cubic-bezier(.22,.8,.24,1); will-change:transform; }
  body.swipe-moving #chatOverlay,body.swipe-moving #inCallBar,
  body.swipe-moving #chatSwipeFallback,
  body.swipe-moving .call-toolbar,body.swipe-moving #viz,body.swipe-moving #emotionStage,body.swipe-moving #dunni-portrait,
  body.swipe-moving #liveDialogue,body.swipe-moving #userAvatar,
  body.swipe-moving #callTop,body.swipe-moving #callStage,body.swipe-moving #callControls{ transition:none; }
  @media(prefers-reduced-motion:reduce){
    #chatOverlay,#chatSwipeFallback,#inCallBar,.call-toolbar,#viz,#emotionStage,#dunni-portrait,#liveDialogue,#userAvatar,#callTop,#callStage,#callControls{transition:none;}
    .emotion-blackout{transition:none;}
  }
  #inCallBar[hidden]{ display:none; }
  #inCallBar{ position:fixed; z-index:9; top:calc(max(9px,env(safe-area-inset-top)) + 76px);
    left:12px; right:12px; min-height:44px; display:flex; align-items:center; justify-content:space-between;
    gap:8px; padding:5px 8px 5px 12px; border:1px solid rgba(69,200,151,.38);
    border-radius:12px; background:rgba(15,36,27,.97); color:#e9fff3;
    box-shadow:0 8px 22px rgba(0,0,0,.35); text-align:left; }
  #inCallBarStatus{ min-width:0; font-size:12px; font-weight:600; line-height:1.35; }
  .in-call-actions{ display:flex; gap:6px; flex:none; }
  .in-call-actions button{ min-height:34px; padding:0 8px; border-radius:8px;
    border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.08);
    color:#fff; font-size:12px; font-weight:600; }
  .in-call-actions .hangup{ border-color:rgba(216,90,48,.5); background:rgba(216,90,48,.26); }
  .panel{ position:absolute; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.94);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    padding:32px; }
  .panel input{ width:min(86vw,320px); height:46px; background:#0c0c0c; border:1px solid var(--faint);
    color:var(--light); border-radius:12px; padding:0 16px; font-size:16px; text-align:center; }
  .panel label{ font-size:14px; color:var(--dim); }
  .panel .save{ background:var(--light); color:var(--ink); border:none; border-radius:12px;
    padding:12px 32px; font-size:16px; font-weight:500; cursor:pointer; }
  .hint{ font-size:12px; color:var(--dim); max-width:300px; line-height:1.6; }
  .panel .linkbtn{ background:none; border:1px solid var(--faint); color:var(--dim);
    border-radius:12px; padding:11px 26px; font-size:15px; cursor:pointer; }
  .panel .linkbtn:hover{ color:var(--light); border-color:var(--dim); }
  .emotion-menu{ width:min(86vw,320px); display:grid; gap:8px; }
  .emotion-menu .linkbtn{ width:100%; }
  .emotion-menu select{ width:100%; height:42px; padding:0 12px; border-radius:10px;
    border:1px solid var(--faint); background:#111; color:#fff; font:inherit; font-size:14px; }
  /* 对话记录面板 */
  .logpanel{ justify-content:flex-start; padding:0; background:#090a05; }
  .logbar{ display:flex; align-items:center; gap:14px; width:100%;
    padding:max(4vh,18px) 20px 14px; border-bottom:1px solid var(--faint); }
  .logbar button{ background:none; border:none; color:var(--dim); font-size:16px; cursor:pointer; padding:4px; }
  .logbar button:hover{ color:var(--light); }
  .logbar .ttl{ font-size:16px; color:var(--light); font-weight:500; }
  .logbody{ flex:1; width:100%; max-width:560px; overflow-y:auto;
    padding:14px 18px 28px; display:flex; flex-direction:column; gap:10px;
    -webkit-overflow-scrolling:touch; }
  .logbody.detail{ max-width:920px; gap:16px; }
  .logempty{ color:var(--dim); font-size:14px; text-align:center; margin-top:40px; line-height:1.8; }
  .callitem{ background:#0c0c0c; border:1px solid var(--faint); border-radius:14px;
    padding:14px 16px; cursor:pointer; text-align:left; }
  .callitem:hover{ border-color:var(--dim); }
  .callitem .when{ font-size:14px; color:var(--light); }
  .callitem .meta{ font-size:12px; color:var(--dim); margin-top:3px; }
  .callitem .prev{ font-size:13px; color:var(--dim); margin-top:7px; line-height:1.5;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .turn{ max-width:82%; padding:9px 13px; border-radius:14px; font-size:15px; line-height:1.55; }
  .turn .tts{ display:block; font-size:10px; color:var(--dim); margin-bottom:3px; opacity:.7; }
  .turn.bao{ align-self:flex-start; background:#141414; border:1px solid var(--faint);
    color:var(--light); border-bottom-left-radius:4px; }
  .turn.coach{ align-self:flex-end; background:#1d2733; color:#dfeaf5; border-bottom-right-radius:4px; }
  .turn.coach .tts{ text-align:right; }
  .audiobar{ position:relative; background:rgba(0,0,0,.96); border:1px solid var(--faint);
    border-radius:14px; padding:12px 14px; display:flex; flex-direction:column; gap:10px; margin-bottom:4px; }
  .audiobar.primary{ position:sticky; top:0; z-index:2; }
  .audiobar audio{ width:100%; height:34px; }
  .audiobar .noaud{ font-size:13px; color:var(--dim); text-align:center; }
  .audiobar .keeprow{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .audiobar .keepstatus{ font-size:12px; color:var(--dim); }
  .keepbtn{ background:none; border:1px solid var(--faint); color:var(--dim);
    border-radius:10px; padding:8px 16px; font-size:13px; cursor:pointer; white-space:nowrap; }
  .keepbtn.on{ background:rgba(224,165,46,.16); border-color:#e0a52e; color:#e8c46a; }
  .callitem .badges{ font-size:12px; margin-top:4px; }
  .detailgrid{ display:grid; grid-template-columns:minmax(0,1fr); gap:16px; align-items:start; }
  .detailmeta{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; }
  .timelinecard{ display:flex; flex-direction:column; gap:12px; min-height:0; }
  .turnlist{ display:flex; flex-direction:column; gap:12px; min-height:0; }
  .verlink{ display:none !important; position:relative; z-index:3; background:none; border:none; color:rgba(255,255,255,.34); font-size:11px;
    letter-spacing:.1em; cursor:pointer; padding:6px 12px; }
  .verlink:hover{ color:var(--dim); }
  .veritem{ border:1px solid var(--faint); border-radius:12px; padding:12px 14px; }
  .veritem .vh{ display:flex; align-items:center; gap:8px; }
  .veritem .vtype{ font-size:11px; padding:2px 9px; border-radius:6px; white-space:nowrap; }
  .veritem .vtime{ font-size:11px; color:var(--dim); letter-spacing:.04em; }
  .veritem .vtitle{ font-size:14px; color:var(--light); margin-top:7px; line-height:1.5; }
  .veritem .vdesc{ font-size:12px; color:var(--dim); margin-top:4px; line-height:1.55; }
  .inneritem{ border:1px solid var(--faint); border-left:2px solid rgba(255,255,255,.18);
    border-radius:12px; padding:13px 16px; }
  .inneritem .it{ font-size:11px; color:var(--dim); margin-bottom:7px; letter-spacing:.04em; }
  .inneritem .ix{ font-size:14px; color:rgba(255,255,255,.82); line-height:1.7; white-space:pre-wrap; }
  .callpane{ position:relative; z-index:3; transition:transform .34s ease, opacity .34s ease; will-change:transform,opacity; touch-action:pan-y pinch-zoom; }
  .meetingview{ position:fixed; inset:0; z-index:2; padding:max(7.4vh,58px) 16px max(4.8vh,22px);
    display:flex; align-items:stretch; justify-content:flex-start; pointer-events:none; opacity:0; touch-action:pan-y;
    transform:translate3d(calc(-100% - 18px),0,0); transition:transform .34s ease, opacity .34s ease; }
  .meetingview.open{ pointer-events:auto; opacity:1; transform:translate3d(0,0,0); }
  .meetingsheet{ width:min(100%,540px); height:100%; display:grid; grid-template-rows:auto minmax(0,1fr) auto;
    max-height:100%; overflow:hidden; gap:12px; padding:12px; border:1px solid rgba(255,255,255,.08); border-radius:18px; touch-action:pan-y;
    background:linear-gradient(180deg,rgba(8,10,10,.9),rgba(8,8,8,.72)); backdrop-filter:blur(14px); }
  .meetinghead{ display:block; }
  .meetingtopwave{ height:28px; border-radius:12px; border:1px solid rgba(255,255,255,.06);
    background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.008)); overflow:hidden; }
  .meetingbody{ min-height:0; display:grid; grid-template-rows:minmax(420px,1fr) auto; gap:10px; }
  .meetingbody.expanded{ grid-template-rows:minmax(540px,1fr) auto; }
  .recordcard,.meetingactionbar{ border:1px solid rgba(255,255,255,.08); border-radius:16px; background:rgba(255,255,255,.03); text-align:left; overflow:hidden; }
  .recordcard{ display:grid; grid-template-rows:auto minmax(172px,1fr); padding:12px; gap:10px; }
  .recordmeta{ display:flex; align-items:center; flex-wrap:wrap; gap:10px 12px; }
  .recordmeta .grow{ flex:1 1 auto; }
  .transportbar{ display:flex; align-items:center; gap:10px; min-height:36px; padding:0 2px; }
  .transportpill{ display:inline-flex; align-items:center; min-height:28px; padding:0 12px; border-radius:999px; border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.05); color:var(--light); font-size:12px; white-space:nowrap; }
  .transportpill.connecting{ border-color:rgba(115,197,255,.34); background:rgba(115,197,255,.12); color:#dff5ff; }
  .transportpill.backend-live{ border-color:rgba(86,214,154,.38); background:rgba(29,158,117,.16); color:#e9fff4; }
  .transportpill.append-reconnect,.transportpill.rollover{ border-color:rgba(255,204,94,.34); background:rgba(255,204,94,.12); color:#fff1c5; }
  .transportpill.stream-dead,.transportpill.error{ border-color:rgba(234,90,69,.34); background:rgba(234,90,69,.12); color:#ffe2dc; }
  .transportpill.fallback-active{ border-color:rgba(179,120,255,.34); background:rgba(179,120,255,.12); color:#f0e6ff; }
  .transportpill.closed,.transportpill.idle{ border-color:rgba(255,255,255,.1); background:rgba(255,255,255,.05); color:rgba(255,255,255,.76); }
  .transportdetail{ min-width:0; flex:1 1 auto; font-size:12px; line-height:1.55; color:rgba(255,255,255,.64); }
  .recordtoggle{ display:inline-flex; align-items:center; gap:8px; min-height:32px; padding:0 10px; border-radius:999px;
    border:1px solid rgba(255,255,255,.08); background:rgba(255,255,255,.04); color:rgba(255,255,255,.72); font-size:12px; }
  .recordtoggle input{ width:15px; height:15px; accent-color:#56d69a; }

<script>
(function(){
  const LK = window.LivekitClient;
  const $ = id => document.getElementById(id);
  const statusEl=$('status');
  const callBtn=$('callBtn'), callCircle=$('callCircle'), callIcon=$('callIcon'), callLabel=$('callLabel');
  const muteBtn=$('muteBtn'), muteCircle=$('muteCircle'), muteLabel=$('muteLabel');
  const menuToggle=$('menuToggle'), panel=$('panel'), panelClose=$('panelClose');
  const chatReturn=$('chatReturn'), chatOverlay=$('chatOverlay');
  const inCallBar=$('inCallBar'), inCallBarStatus=$('inCallBarStatus');
  const callPanes=[$('callTop'), $('callStage'), $('callControls'), $('verLink')];
  const liveBubbles={assistant:$('agentLiveBubble'),user:$('userLiveBubble')};
  const liveTexts={assistant:$('agentLiveText'),user:$('userLiveText')};
  const liveSegments=new Map();
  const liveLatest={assistant:0,user:0};
  let liveSequence=0;
  function resetLiveDialogue(){
    liveSegments.clear(); liveLatest.assistant=0; liveLatest.user=0; liveSequence=0;
    liveTexts.assistant.textContent='通話接通後，這裡會顯示端倪正在說的話。';
    liveTexts.user.textContent='你說的話會即時出現在這裡。';
    liveBubbles.assistant.classList.remove('interim');
    liveBubbles.user.classList.remove('interim');
  }
  function showLiveTranscript(role,segmentId,text,isFinal){
    if(!liveBubbles[role] || !segmentId || !text) return;
    const key=role+':'+segmentId;
    let segment=liveSegments.get(key);
    if(!segment){
      segment={order:++liveSequence,final:false}; liveSegments.set(key,segment);
      // Keep only a bounded amount of segment bookkeeping during long calls.
      if(liveSegments.size>80) liveSegments.delete(liveSegments.keys().next().value);
    }
    if(segment.final && !isFinal) return;
    if(isFinal) segment.final=true;
    if(segment.order<liveLatest[role]) return;
    liveLatest[role]=segment.order;
    const bubble=liveBubbles[role];
    liveTexts[role].textContent=text;
    bubble.classList.toggle('interim',!isFinal);
    bubble.scrollTop=bubble.scrollHeight;
  }
  const meetingView=$('meetingView'), swipeHint=$('swipeHint');
  const meetingStatus=$('meetingStatus'), meetingBadge=$('meetingBadge'), meetingTimer=$('meetingTimer');
  const meetingChunkMeta=$('meetingChunkMeta'), meetingDraftState=$('meetingDraftState');
  const meetingChunkRail=$('meetingChunkRail'), meetingFormalBtn=$('meetingFormalBtn');
  const meetingBody=$('meetingBody'), meetingExpandBtn=$('meetingExpandBtn');
  const meetingTransportBar=$('meetingTransportBar'), meetingTransportBadge=$('meetingTransportBadge');
  const meetingTransportDetail=$('meetingTransportDetail');
  const meetingRecordBtn=$('meetingRecordBtn'), meetingRecordLabel=$('meetingRecordLabel');
  const meetingPauseBtn=$('meetingPauseBtn'), meetingDiscardBtn=$('meetingDiscardBtn');
  const meetingSaveAudioToggle=$('meetingSaveAudioToggle');
  const meetingWave=$('meetingWave'), meetingWaveCtx=meetingWave.getContext('2d');

  let room=null, connecting=false, muted=false, currentCallId='';
  const emotionNames={happy:'开心',curious:'好奇',unhappy:'有些失落',sad:'难过',
    angry:'认真',delighted:'雀跃',playful_face:'调皮'};
  const emotionReceipts=[];
  window.YulingEmotionReceipts=emotionReceipts;
  const emotionVideo=new window.YulingEmotionVideo.EmotionVideoController({
    stage:$('emotionStage'), neutral:$('neutralVideo'), clip:$('emotionClip'),
    blackout:$('emotionBlackout'),
    reducedMotion:window.matchMedia('(prefers-reduced-motion: reduce)'),
    onStateChange(state){
      if(state==='neutral') document.body.removeAttribute('data-emotion');
      else document.body.dataset.emotion=state;
      $('dunniLiveSpeaker').textContent=state==='neutral'?'陈端倪':`陈端倪 · ${emotionNames[state]}`;
    },
    onReceipt(receipt){ emotionReceipts.push(receipt); if(emotionReceipts.length>50) emotionReceipts.shift(); }
  });
  document.addEventListener('visibilitychange',()=>emotionVideo.onVisibilityChange(document.hidden));
  emotionVideo.reducedMotion.addEventListener?.('change',()=>
    emotionVideo.onVisibilityChange(document.hidden));
  const remoteAudioElements=new Map();
  let audioRetryHandler=null;
  function clearAudioRetry(){
    if(audioRetryHandler) document.removeEventListener('pointerdown',audioRetryHandler);
    audioRetryHandler=null;
  }
  let callAttemptId=0;
  let CHAT_SESSION_KEY='';
  let transcriptSaveQueue=Promise.resolve();
  const savedTranscriptCalls=new Set(), failedTranscriptCalls=new Set();
  const MEETING_ENABLED=false; // Call POC: keep the original recorder code, disable its UI and gestures.
  const API_ROOT=(location.protocol==='file:')
    ? 'http://127.0.0.1:8080'
    : (location.port==='3000' ? `${location.protocol}//${location.hostname}:8080` : '');
  const apiUrl=path=>`${API_ROOT}${path}`;

    const result=new Float32Array(newLength);
    let offset=0;
    for(let i=0;i<newLength;i++){
      const next=Math.min(input.length, Math.round((i+1)*ratio));
      let sum=0, count=0;
      for(let j=offset;j<next;j++){ sum += input[j]; count += 1; }
      result[i]=count ? (sum/count) : 0;

    }
    return result;
  }

    for(let i=0;i<down.length;i++){

    rec.onend=null;
    try{ rec.stop(); }catch(_){}

  function startMeetingSpeechRecognition(){
    const Ctor=speechCtor();
    meetingRec.speechSupported=!!Ctor;
    if(!Ctor || !meetingRec.isRecording || meetingRec.isPaused) return false;
    stopMeetingSpeechRecognition(false);
    const rec=new Ctor();
    rec.lang='zh-CN';
    rec.continuous=true;
    rec.interimResults=true;
    rec.maxAlternatives=1;
    meetingRec.speechStartedAt=performance.now();
    meetingRec.speechLastEventAt=meetingRec.speechStartedAt;
    rec.onresult=(event)=>{
      meetingRec.speechLastEventAt=performance.now();
      let interim=[];
      for(let i=event.resultIndex;i<event.results.length;i++){
        const part=((event.results[i]||[{}])[0]||{}).transcript||'';
        const text=String(part).replace(/\s+/g,' ').trim();
        if(!text) continue;
        if(event.results[i].isFinal){
          const endMs=meetingElapsedMs();
          const startMs=meetingRec.lastFinalMs || Math.max(0,endMs-1800);
          appendMeetingTranscript(text, startMs, endMs, 'browser');
          meetingRec.lastFinalMs=endMs;
        }else{
          interim.push(text);
        }
      }
      meetingRec.interimText=interim.join(' ').trim();
      meetingRec.speechError='';
      maybeRollMeetingMinute(false);
      setMeetingUi();
    };
    rec.onerror=(event)=>{
      meetingRec.speechLastEventAt=performance.now();
      const code=(event&&event.error)||'speech-error';
      if(code!=='no-speech') meetingRec.speechError=code;
      if(code==='not-allowed' || code==='service-not-allowed' || code==='audio-capture'){
        meetingRec.speechSupported=false;
        meetingStatus.textContent='浏览器没有开放实时字幕权限，先退回背景录音保存。';
      }
    };
    rec.onend=()=>{
      meetingRec.speechRunning=false;
      if(meetingRec.isRecording && !meetingRec.isPaused && meetingRec.speechSupported){
        setTimeout(()=>{
          if(meetingRec.isRecording && !meetingRec.isPaused && !meetingRec.speechRunning){
            startMeetingSpeechRecognition();
          }
        }, 180);
      }
    };
    try{
      rec.start();
      meetingRec.speechRec=rec;
      meetingRec.speechRunning=true;
      meetingRec.speechError='';
      meetingRec.speechSupported=true;
      if(!meetingRec.backendLiveActive) setMeetingStreamState('fallback-active', '目前先用这台装置的实时字幕顶住，等后端恢复会切回主路径。');
      scheduleMeetingSpeechRecycle();
      return true;
    }catch(_){
      meetingRec.speechSupported=false;
      return false;
    }
  }
  async function uploadMeetingMinuteNote(note){
    if(!note || note.uploading || note.done) return;
    note.uploading=true;
    setMeetingUi();
    try{
      const res=await fetch(apiUrl('/api/yuling/meetings/minute-note'),{
        method:'POST',
        headers:Object.assign({'Content-Type':'application/json'},logHeaders()),
        body:JSON.stringify({
          session_id:meetingRec.sessionId,
          minute_index:note.minuteIndex,
          start_ms:Math.round(note.startMs),
          end_ms:Math.round(note.endMs),
          transcript:note.transcript
        })
      });
      if(!res.ok) throw new Error('minute note '+res.status);
      const data=await res.json();
      meetingRec.sessionId=data.session_id||meetingRec.sessionId;
      note.summary=(data.summary||note.summary||'').trim();
      note.error='';
      note.done=true;
      loadMeetingHistory();
    }catch(err){
      note.error=String((err&&err.message)||err||'minute note failed');
    }finally{
      note.uploading=false;

    }
  }
  function maybeRollMeetingMinute(force){
    const elapsed=meetingElapsedMs();
    if(force && elapsed<NOTE_ROLLUP_MS){
      return;
    }
    const eligibleMinute=force
      ? Math.ceil(Math.max(0, elapsed)/NOTE_ROLLUP_MS)
      : Math.floor(Math.max(0, elapsed-5000)/NOTE_ROLLUP_MS);
    while(meetingRec.nextMinuteIndex<=eligibleMinute){
      const minuteIndex=meetingRec.nextMinuteIndex;
      const startMs=(minuteIndex-1)*NOTE_ROLLUP_MS;
      const endMs=Math.min(force ? elapsed : minuteIndex*NOTE_ROLLUP_MS, elapsed);
      const slicesForMinute=meetingBackendSlices().filter(slice=>slice.minuteIndex===minuteIndex);
      const pendingForMinute=slicesForMinute.some(slice=>!slice.done && !slice.error);
      const transcript=meetingBackendSlices()
        .filter(slice=>slice.done && !slice.error && slice.minuteIndex===minuteIndex && slice.transcript)
        .map(slice=>slice.transcript.trim())
        .filter(Boolean)
        .join(' ')
        .trim();
      if(!force && pendingForMinute){
        return;
      }
      if(transcript){
        const note={
          minuteIndex,
          startMs,
          endMs,
          transcript,
          summary:'',
          uploading:false,
          done:false,
          error:''
        };
        meetingRec.minuteNotes.push(note);
        uploadMeetingMinuteNote(note);
      }
      meetingRec.nextMinuteIndex += 1;
    }
  }

    initializing:'端倪接通中…',listening:'收音中',thinking:'端倪思考中',

  async function enableMotionFX(){

         typeof DeviceMotionEvent.requestPermission==='function'){

        $('viz').dataset.motionTilt=`${Math.round(motionFX.tx*100)},${Math.round(motionFX.ty*100)}`;

  // ═══════════ 螺旋丸 · 声浪光球 (audio-reactive viz) ═══════════
  const cv=$('viz'), cx=cv.getContext('2d');

  function vizResize(){
    DPR=Math.min(window.devicePixelRatio||1,2);

  vizResize(); addEventListener('resize', vizResize);

  let micCalc=null, baoCalc=null;   // 实时声浪 0..1 (track 就绪才接)
  let mLvl=0, bLvl=0;               // 平滑后的等级 (禅意: 缓起缓落)
  let lastVizTelemetryAt=0;
  const lerp=(a,b,k)=>a+(b-a)*k;

  // 鸟群 (彗星/V 队形): 领头鸟飞, 后面的鸟沿「领头走过的轨迹」一只接一只跟进。
  // 每只取领头历史上的一个过去点(age=延迟) + 侧向偏移(往尾巴变宽=V) → 自然彗星尾。
  const FN = innerWidth<700 ? 420 : 760;
  const fage=new Float32Array(FN), flat=new Float32Array(FN),
        fper=new Float32Array(FN), fph=new Float32Array(FN), fsz=new Float32Array(FN);
  for(let i=0;i<FN;i++){
    fage[i]=Math.pow(Math.random(), 0.7);    // 沿尾巴位置 0=头 1=尾 (偏头密)
    flat[i]=Math.random()*2-1;               // 侧向偏移 → V 扩散
    fper[i]=1+Math.floor(Math.random()*3);   // 闪烁周期 1/2/3 秒
    fph[i]=Math.random()*6.2832;             // 闪烁相位
    fsz[i]=0.5+Math.random()*0.7;            // 大小微差
  }
  const HIST=600;                            // 领头轨迹环形缓冲 (帧)
  const hx=new Float32Array(HIST), hy=new Float32Array(HIST);
  let hidx=0, histSeeded=false;
  let lx=0, ly=0, lvx=0, lvy=0, lhead=0, prevGv=0, armRot=0;  // 领头鸟 + 航向

  const ripples=[]; let lastRip=0, t0=null;

  function vizFrame(ts){
    if(t0===null) t0=ts; const t=(ts-t0)/1000;
    const micRaw = micCalc ? Math.min(1, micCalc()*1.7) : 0;
    const baoRaw = baoCalc ? Math.min(1, baoCalc()*1.8) : 0;
    if(micRaw>0.08) lastUserVoiceAt=ts;
    if(baoRaw>0.06){
      const firstRemoteAudio=lastBaoVoiceAt===0;
      lastBaoVoiceAt=ts;
      markCallAnswered();
      if(firstRemoteAudio){
        setLamp('audio','ok');
        if(room) setLamp('tts','warn','本次已检测到 Agent 声音；MiniMax TTS 尚未独立验证');
      }
    }
    mLvl = lerp(mLvl, micRaw, micRaw>mLvl?0.35:0.08);   // 起快落慢 = 自然
    bLvl = lerp(bLvl, baoRaw, baoRaw>bLvl?0.40:0.07);
    if(ts-lastVizTelemetryAt>250){
      cv.dataset.localAudioLevel=String(Math.round(mLvl*100));
      cv.dataset.remoteAudioLevel=String(Math.round(bLvl*100));
      lastVizTelemetryAt=ts;
    }
    motionFX.x=lerp(motionFX.x,motionFX.tx,0.08);
    motionFX.y=lerp(motionFX.y,motionFX.ty,0.08);
    motionFX.shake*=0.88;
    motionFX.colorGlow*=0.975;
    const vol = Math.max(mLvl, bLvl);
    const gv = vol<0.06 ? 0 : (vol-0.06)/0.94;          // 噪声门槛: 真安静→0 (挡麦克风底噪)
    const bao = bLvl>=mLvl;                               // 谁在发声 → 配色
    const baseHue = bao ? 158 : 192;                      // 陈端倪=青绿, 使用者=冷白蓝
    const hue = motionFX.hue===null ? baseHue : lerp(baseHue,motionFX.hue,Math.min(1,motionFX.colorGlow));
    const sat = 20 + vol*38, lit = 62 + vol*16;
    const motionPush=motionFX.enabled ? (1+vol*.8) : 0;
    const portraitLayout=innerWidth<=700;
    const cxp=VW*(portraitLayout?0.34:0.5) - motionFX.x*DPR*48*motionPush;
    const cyp=VH*(portraitLayout?0.34:0.5) + motionFX.y*DPR*26*motionPush;
    const base=Math.min(VW,VH)*0.125, breathe=1+Math.sin(t*0.8)*0.04;

    cx.globalCompositeOperation='lighter';

    // 全画面气晕 (极淡)
    let g=cx.createRadialGradient(cxp,cyp,0,cxp,cyp,Math.max(VW,VH)*0.6);
    const aA=0.01+vol*0.05;
    g.addColorStop(0,`hsla(${hue},${sat}%,${lit}%,${aA})`);
    g.addColorStop(0.5,`hsla(${hue},${sat}%,${lit}%,${aA*0.2})`);
    g.addColorStop(1,'hsla(0,0%,0%,0)');
    cx.fillStyle=g; cx.fillRect(0,0,VW,VH);

    // 光球外晕 (薄雾)

    g.addColorStop(0,`hsla(${hue},${sat}%,${lit}%,${0.045+vol*0.11})`);
    g.addColorStop(0.45,`hsla(${hue},${sat}%,${lit}%,${0.015+vol*0.05})`);
    g.addColorStop(1,'hsla(0,0%,0%,0)');
    cx.fillStyle=g; cx.beginPath(); cx.arc(cxp,cyp,R*2.6,0,6.2832); cx.fill();

    // (螺旋臂层已移除 — 使用者 2026-06-15)

    // 核 (柔, 不刺眼)
    g=cx.createRadialGradient(cxp,cyp,0,cxp,cyp,R*1.1);
    g.addColorStop(0,`hsla(${hue},${Math.max(0,sat-14)}%,${Math.min(90,lit+14)}%,${0.18+vol*0.14})`);
    g.addColorStop(0.5,`hsla(${hue},${sat}%,${lit+6}%,${0.07+vol*0.1})`);

    if(!histSeeded){ for(let i=0;i<HIST;i++){ hx[i]=cxp; hy[i]=cyp; } lx=cxp; ly=cyp; histSeeded=true; }
    // 新声音进来 → 领头随机改变方向 (rising edge)
    if(gv>0.16 && prevGv<=0.16) lhead=Math.random()*6.2832;
    prevGv=gv;
    lhead += Math.sin(t*0.8+7.1)*0.03;                        // 平滑缓转 (非每帧乱跳, 才不像蚊子)
    const spd=Math.min(VW,VH)*0.0085*gv;                      // 速度随声浪 (静止=0)

    const portrait=$('dunni-portrait').getBoundingClientRect();
    if(portrait.width && portrait.height){
      cx.save();
      cx.translate((portrait.left+portrait.width*0.67)*DPR,
        (portrait.top+portrait.height*0.74)*DPR);
      cx.scale(portrait.width*0.32*DPR,portrait.height*0.25*DPR);
      const faceMask=cx.createRadialGradient(0,0,0,0,0,1);
      faceMask.addColorStop(0,'rgba(0,0,0,1)');

  // 从 LiveKit track 取实时声浪 (0..1)。优先用 LK 内建, 退 Web Audio。
  function makeVol(track){
    try{
      if(LK.createAudioAnalyser){
        const a=LK.createAudioAnalyser(track,{cloneTrack:true,fftSize:256});
        return a.calculateVolume;
      }
    }catch(_){}
    try{
      const mst=track.mediaStreamTrack||(track.mediaStream&&track.mediaStream.getAudioTracks()[0]);
      if(!mst) return null;
      const AC=window.AudioContext||window.webkitAudioContext;
      const ac=window._yac||(window._yac=new AC());
      if(ac.state==='suspended') ac.resume();
      const src=ac.createMediaStreamSource(new MediaStream([mst]));
      const an=ac.createAnalyser(); an.fftSize=256; src.connect(an);
      const buf=new Uint8Array(an.frequencyBinCount);
      return ()=>{ an.getByteFrequencyData(buf); let s=0; for(let i=0;i<buf.length;i++)s+=buf[i]; return s/buf.length/255; };
    }catch(_){ return null; }
  }

  function resizeMeetingWave(){

  function drawMeetingWave(){

    if(arr) meetingRec.analyser.getByteFrequencyData(arr);
    const samples=[];
    for(let i=0;i<=bins;i++){
      let sample=0;
      if(arr){
        const stride=Math.max(1,Math.floor(arr.length/bins));
        const start=Math.min(arr.length-1,i*stride);
        let sum=0;
        for(let j=0;j<stride && start+j<arr.length;j++) sum+=arr[start+j];
        sample=(sum/Math.max(1,stride))/255;

      { hue:190, alpha:0.38, width:Math.max(2.1,w/280), speed:620, offset:0.0, lift:-0.16, blur:14 },
      { hue:285, alpha:0.34, width:Math.max(2.0,w/300), speed:760, offset:1.3, lift:0.0, blur:16 },
      { hue:325, alpha:0.31, width:Math.max(1.9,w/320), speed:540, offset:2.2, lift:0.16, blur:14 },
    ];
    const centerY=h/2;
    ctx.globalCompositeOperation='lighter';
    layers.forEach(layer=>{
      ctx.beginPath();
      for(let i=0;i<=bins;i++){
        const x=w*(i/bins);
        const wave=Math.sin((now/layer.speed)+(i*0.42)+layer.offset)*0.65
          + Math.sin((now/(layer.speed*0.66))+(i*0.19)+layer.offset*1.7)*0.35;
        const cloud=Math.exp(-Math.pow((i-bins/2)/(bins*0.28),2));
        const pulse=1.8+samples[i]*8.9;
        const y=centerY + layer.lift*h + wave*ampBase*pulse*cloud;
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.strokeStyle=`hsla(${layer.hue},85%,68%,${layer.alpha})`;
      ctx.lineWidth=layer.width;
      ctx.lineCap='round';
      ctx.shadowBlur=layer.blur;
      ctx.shadowColor=`hsla(${layer.hue},90%,70%,${layer.alpha*1.4})`;
      ctx.stroke();
    });
    ctx.shadowBlur=0;
    const glow=ctx.createRadialGradient(w/2,h/2,0,w/2,h/2,h*0.6);
    glow.addColorStop(0,'rgba(255,255,255,0.10)');
    glow.addColorStop(.45,'rgba(95,165,255,0.08)');
    glow.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=glow;
    ctx.fillRect(0,0,w,h);
    ctx.globalCompositeOperation='source-over';
    meetingRec.raf=requestAnimationFrame(drawMeetingWave);
  }

  async function startMeetingRecording(){
    if(meetingRec.isRecording) return;
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      meetingStatus.textContent='这台装置不支持录音。';
      return;
    }
    try{
      const startRes=await fetch(apiUrl('/api/yuling/meetings/stream/start'),{
        method:'POST',
        headers:Object.assign({'Content-Type':'application/json'},logHeaders()),
        body:JSON.stringify({save_audio: !!(meetingSaveAudioToggle&&meetingSaveAudioToggle.checked)}),
      });
      if(!startRes.ok) throw new Error('stream-start '+startRes.status);
      const started=await startRes.json();
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      meetingRec.stream=stream;
      meetingRec.recorder=null;
      meetingRec.mimeType='audio/pcm';
      meetingRec.segments=[];
      meetingRec.liveSlices=[];
      meetingRec.minuteNotes=[];
      meetingRec.isRecording=true;
      meetingRec.isPaused=false;
      meetingRec.startAt=performance.now();
      meetingRec.pausedMs=0;
      meetingRec.pauseAt=0;
      meetingRec.segmentStartMs=0;
      meetingRec.nextMinuteIndex=1;
      meetingRec.minuteUploading=false;
      meetingRec.speechSupported=false;
      meetingRec.speechRunning=false;
      meetingRec.interimText='';
      meetingRec.lastFinalMs=0;
      meetingRec.backendLiveActive=false;
      meetingRec.speechError='';
      meetingRec.formalizing=false;
      meetingRec.formalizedAt=0;
      meetingRec.streamState='connecting';
      meetingRec.streamStateNote='后端实时字幕正在建立长连接。';
      meetingRec.streamStateAt=Date.now();
      meetingRec.streamEvents=[];
      pushMeetingStreamEvent(meetingRec.streamState, meetingRec.streamStateNote);
      meetingRec.sessionId=started.session_id||'';
      meetingRec.saveAudio=!!started.save_audio;
      meetingRec.pcmQueue=[];
      meetingRec.pcmUploading=false;
      meetingRec.pcmCursorMs=0;
      meetingRec.streamConnected=false;
      ensureMeetingAudioGraph(stream);
      startMeetingPcmPump(stream);
      startMeetingEventStream(meetingRec.sessionId);
      scheduleMeetingSpeechFallback(1600);
      resizeMeetingWave();
      stopMeetingWave();
      drawMeetingWave();
      setMeetingUi();
    }catch(err){
      meetingStatus.textContent='麦克风没有成功开启。';
      meetingDraftState.textContent='录音失败';
    }
  }
  async function stopMeetingRecording(){
    if(!meetingRec.isRecording) return;
    stopMeetingPcmPump();
    stopMeetingSpeechRecognition(false);
    await waitForMeetingPcmDrain(2200);
    stopMeetingEventStream();
    let stopResult=null;
    if(meetingRec.sessionId){
      try{
        const stopRes=await fetch(apiUrl(`/api/yuling/meetings/stream/${encodeURIComponent(meetingRec.sessionId)}/stop`),{
          method:'POST',
          headers:logHeaders(),
        });
        if(stopRes.ok) stopResult=await stopRes.json();
      }catch(_){}
    }
    maybeRollMeetingMinute(true);
    if(meetingRec.sessionId){
      try{
        const detailRes=await fetch(apiUrl(`/api/yuling/meetings/${encodeURIComponent(meetingRec.sessionId)}`),{
          headers:logHeaders(),
        });
        if(detailRes.ok){
          const detail=await detailRes.json();
          meetingRec.saveAudio=!!(detail.settings&&detail.settings.save_audio);
          meetingRec.segments=Array.isArray(detail.chunks)?detail.chunks:[];
          meetingRec.liveSlices=Array.isArray(detail.live_slices)?detail.live_slices.map((slice, idx)=>({
            index:Number(slice.slice_index||idx+1),
            startMs:Math.max(0, Number(slice.start_ms||0)),
            endMs:Math.max(0, Number(slice.end_ms||0)),
            blob:null,
            transcript:String(slice.transcript||'').trim(),
            done:true,
            uploading:false,
            error:'',
            source:'backend',
            minuteIndex:Math.floor(Math.max(0, Number(slice.start_ms||0))/NOTE_ROLLUP_MS)+1
          })).filter(slice=>slice.transcript):meetingRec.liveSlices;
          meetingRec.minuteNotes=Array.isArray(detail.minute_notes)?detail.minute_notes.map(note=>({
            minuteIndex:Number(note.minute_index||0),
            startMs:Math.max(0, Number(note.start_ms||0)),
            endMs:Math.max(0, Number(note.end_ms||0)),
            transcript:String(note.transcript||'').trim(),
            summary:String(note.summary||'').trim(),
            uploading:false,
            done:true,
            error:''
          })):meetingRec.minuteNotes;
          if(detail.formal_record&&detail.formal_record.formalized_at){
            meetingRec.formalizedAt=Date.parse(detail.formal_record.formalized_at)||meetingRec.formalizedAt;
          }
        }
      }catch(_){}
    }
    if(stopResult&&typeof stopResult.end_ms==='number'){
      meetingRec.lastFinalMs=Math.max(meetingRec.lastFinalMs||0, stopResult.end_ms||0);
    }
    if(meetingRec.stream) meetingRec.stream.getTracks().forEach(t=>t.stop());
    meetingRec.stream=null;
    meetingRec.recorder=null;
    meetingRec.isRecording=false;
    meetingRec.isPaused=false;
    meetingRec.pauseAt=0;
    meetingRec.analyser=null;
    if(meetingRec.source) try{ meetingRec.source.disconnect(); }catch(_){}
    meetingRec.source=null;
    setMeetingStreamState('closed', '这段录音已停止；字幕与陈端倪作业停在目前内容。');
    stopMeetingWave();
    setMeetingUi();
    loadMeetingHistory();
  }

  const audioEventFX={timer:null,baseline:0.015,last:{},bound:false};
  function classifyAudioEvent(rms,peak,highRatio,zcr){
    if(peak>0.82 && rms>audioEventFX.baseline*5) return {label:'impact', confidence:Math.min(0.95, peak)};
    if(rms>0.16 && peak>0.62 && highRatio>0.30) return {label:'sneeze', confidence:Math.min(0.92, 0.55+rms+highRatio*.5)};
    if(rms>0.09 && peak>0.36 && highRatio>0.16 && zcr>0.05) return {label:'cough', confidence:Math.min(0.88, 0.48+rms+highRatio*.45)};
    return null;
  }
  function postAudioEvent(evt, metrics){
    if(!currentCallId || !evt) return;
    const now=performance.now();
    if(now-(audioEventFX.last[evt.label]||0)<2600) return;
    audioEventFX.last[evt.label]=now;
    fetch(apiUrl('/api/yuling/calls/'+encodeURIComponent(currentCallId)+'/event'),{
      method:'POST',
      headers:Object.assign({'Content-Type':'application/json'},logHeaders()),
      body:JSON.stringify({label:evt.label,confidence:evt.confidence,meta:Object.assign({source:'browser-heuristic'},metrics)})
    }).catch(()=>{});
  }
  function bindAudioEventDetector(track){
    try{
      if(audioEventFX.timer) clearInterval(audioEventFX.timer);
      const mst=track.mediaStreamTrack||(track.mediaStream&&track.mediaStream.getAudioTracks()[0]);
      if(!mst) return;
      const AC=window.AudioContext||window.webkitAudioContext;
      const ac=window._yac||(window._yac=new AC());
      if(ac.state==='suspended') ac.resume();
      const src=ac.createMediaStreamSource(new MediaStream([mst]));
      const an=ac.createAnalyser(); an.fftSize=2048; src.connect(an);
      const td=new Float32Array(an.fftSize), fd=new Uint8Array(an.frequencyBinCount);
      audioEventFX.timer=setInterval(()=>{
        an.getFloatTimeDomainData(td); an.getByteFrequencyData(fd);
        let sum=0, peak=0, crossings=0;
        for(let i=0;i<td.length;i++){
          const v=Math.abs(td[i]); sum+=td[i]*td[i]; if(v>peak) peak=v;
          if(i>0 && ((td[i]>=0)!=(td[i-1]>=0))) crossings++;
        }
        const rms=Math.sqrt(sum/td.length), zcr=crossings/td.length;
        let high=0,total=1;
        for(let i=0;i<fd.length;i++){ total+=fd[i]; if(i>fd.length*.42) high+=fd[i]; }
        const highRatio=high/total;
        audioEventFX.baseline=audioEventFX.baseline*.96+Math.min(rms,0.08)*.04;
        const evt=classifyAudioEvent(rms,peak,highRatio,zcr);
        if(evt) postAudioEvent(evt,{rms:+rms.toFixed(4),peak:+peak.toFixed(4),highRatio:+highRatio.toFixed(3),zcr:+zcr.toFixed(3)});
      },260);
      audioEventFX.bound=true;
    }catch(_){}
  }

  function setLamp(id, state, detail){
    const el=$('lamp-'+id); if(!el) return;
    el.classList.remove('ok','bad','warn');
    if(state) el.classList.add(state);
    const meanings={
      service:{ok:'网页 API 已回应',bad:'网页 API 无法回应',warn:'登录状态需要检查'},
      mic:{ok:'麦克风已启用',bad:'麦克风无法启用',warn:'麦克风已静音'},
      livekit:{ok:'LiveKit API 凭证已验证',bad:'LiveKit API 凭证无效或缺少设置',warn:'LiveKit API 暂时无法验证'},
      room:{ok:'本次已加入 LiveKit 房间',bad:'本次无法加入 LiveKit 房间',warn:'正在加入 LiveKit 房间'},
      agent:{ok:'陈端倪 Agent 已加入房间',bad:'陈端倪 Agent 无法加入房间',warn:'等待陈端倪 Agent 加入'},
      audio:{ok:'已收到 Agent 音轨',bad:'未能收到 Agent 音轨',warn:'等待 Agent 音轨'},
      stt:{ok:'本次已收到你的语音转写',warn:'等待本次语音转写'},
      llm:{warn:'等待本次 Agent 回复；模型供应商尚未独立验证'},
      tts:{warn:'等待本次 Agent 声音；MiniMax TTS 尚未独立验证'}
    };
    const label=el.textContent.trim();
    const meaning=detail||(meanings[id]&&meanings[id][state])||'尚未开始测试';
    el.setAttribute('aria-label',`${label}：${meaning}`);

  function isAgentParticipant(p){

  function syncAgentLamp(callRoom){
    const present=Array.from(callRoom.remoteParticipants.values()).some(isAgentParticipant);

  async function pollHealth(){
    // This request proves the Railway API responds; provider status is verified in-call.
    try{
      const r=await fetch(apiUrl('/api/yuling/health'),{cache:'no-store'});
      if(r.status===401 || r.status===403){
        setLamp('service','warn','登录已过期，请重新登录');
        setLamp('livekit','');
        $('historyHealth').textContent='对话记录：登录后检查';
        $('innerHealth').textContent='通话后心声：登录后检查';
        return;
      }
      if(!r.ok) throw 0;
      const h=await r.json();
      if(h.service && h.service!=='ok') throw 0;
      setLamp('service','ok');
      setLamp('livekit',h.call_config==='verified'?'ok':
        (h.call_config==='invalid'||h.call_config==='missing'?'bad':'warn'));
      try{
        const historyResponse=await fetch(apiUrl('/api/v2/calls'),{credentials:'same-origin',cache:'no-store'});
        $('historyHealth').textContent=historyResponse.ok?'对话记录：逐字稿可读取（目前未验证跨部署保存）':
          historyResponse.status===401?'对话记录：登录后检查':'对话记录：暂不可用';
      }catch(_){ $('historyHealth').textContent='对话记录：暂不可用'; }
      const reflectionHealth=await fetch(apiUrl('/api/v2/call-reflections'),{credentials:'same-origin'});
      $('innerHealth').textContent=`通话后心声：${reflectionHealth.ok?'记录接口正常':'记录接口不可用'}`;
    }catch(_){
      setLamp('service','bad');
      setLamp('livekit','');
      $('historyHealth').textContent='对话记录：无法检查';
      $('innerHealth').textContent='通话后心声：无法检查';
    }
  }

  function saveFinalTranscript(callId, speakerIdentity, segmentId, role, text){
    // Serialize writes so the first segment can create one shared chat session.
    transcriptSaveQueue=transcriptSaveQueue.then(async()=>{
      await accountReady;
      const payload={call_id:callId, speaker_identity:speakerIdentity,
        segment_id:segmentId, role, text};
      const savedSession=CHAT_SESSION_KEY?localStorage.getItem(CHAT_SESSION_KEY):'';
      if(savedSession) payload.session_id=savedSession;
      const post=()=>fetch(apiUrl('/api/v2/call-transcript'),{
        method:'POST', credentials:'same-origin', keepalive:true,
        headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)
      });
      let response;
      // A rolling Railway deploy can briefly return 502/503/504. Re-send the
      // exact same LiveKit segment ID: the server's unique key makes a retry
      // safe even when the first response was lost after the write committed.
      for(let retry=0;retry<3;retry++){
        try{ response=await post(); }catch(error){
          if(retry===2) throw error;
        }
        if(response && ![502,503,504].includes(response.status)) break;
        if(retry<2) await new Promise(resolve=>setTimeout(resolve,250*(retry+1)));
      }
      // A preview redeploy can erase the temporary SQLite file. Start a new
      // session then, while still deduplicating by LiveKit's segment id.
      if(response.status===404 && payload.session_id){
        if(CHAT_SESSION_KEY) localStorage.removeItem(CHAT_SESSION_KEY);
        delete payload.session_id;
        response=await post();
      }
      if(!response.ok) throw new Error('transcript save '+response.status);
      const result=await response.json();
      if(result.session_id&&CHAT_SESSION_KEY) localStorage.setItem(CHAT_SESSION_KEY,result.session_id);
      savedTranscriptCalls.add(callId);
    }).catch(()=>{
      failedTranscriptCalls.add(callId);
      // The call stays usable if the chat store is down. Never claim a failed
      // browser-side receipt was written to the conversation history.
      if(room && callPhase!=='reconnecting') setStatus('通话中 · 逐字稿未能保存');
    });
  }

  // 等待接听铃声 (拨打 → 陈端倪接听之间的过渡期循环播放)
  const ringback=new Audio('/yuling-media/ringback.wav'); ringback.loop=true; ringback.volume=0.35;
  function stopRing(){ try{ ringback.pause(); ringback.currentTime=0; }catch(_){} }
  let callAnswerTimer=null, callAnswered=false, callAnswerTimedOut=false;
  function clearCallAnswerTimer(){
    if(callAnswerTimer!==null) clearTimeout(callAnswerTimer);
    callAnswerTimer=null;
  }
  function markCallAnswered(){
    if(!room || callAnswered) return;
    callAnswered=true;
    clearCallAnswerTimer();
    stopRing();
    if(callAnswerTimedOut){
      callAnswerTimedOut=false;
      setCallPhase('speaking');
    }
  }
  function armCallAnswerTimer(callRoom, attempt){
    clearCallAnswerTimer();
    if(callAnswered) return;
    callAnswerTimer=setTimeout(()=>{
      callAnswerTimer=null;
      if(room!==callRoom || attempt!==callAttemptId || callAnswered || callPhase==='reconnecting') return;
      callAnswerTimedOut=true;
      stopRing();
      setLamp('tts','warn','20 秒内没有收到端倪语音，请挂断后重拨');
      setCallPhase('error','端倪语音响应超时，请挂断后重拨');
    },20000);
  }

  async function startCall(){
    if(connecting||room) return;
    const attempt=++callAttemptId;
    resetLiveDialogue();
    let pendingRoom=null;
    let roomJoined=false;
    connecting=true; agentState=''; lastUserVoiceAt=0; lastBaoVoiceAt=0;
    void emotionVideo.start();
    clearCallAnswerTimer(); callAnswered=false; callAnswerTimedOut=false;
    syncInCallBar();
    setCallPhase('dialing'); callLabel.textContent='连接中';
    setLamp('room','warn'); setLamp('agent','warn'); setLamp('audio','');
    setLamp('stt','warn'); setLamp('llm','warn'); setLamp('tts','warn');
    muteBtn.classList.add('show');   // 连接中→静音钮慢慢从挂断球长出来
    ringback.currentTime=0; ringback.play().catch(()=>{});   // 开始播等待接听音效
    try{
      const res=await fetch(apiUrl('/api/yuling/token'),{
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ identity:'coach', name:'使用者' })
      });
      if(attempt!==callAttemptId) return;
      if(res.status===403){ stopRing(); setCallPhase('error','通话权限未开放'); resetCallLampsAfterFailure('通话凭证被拒绝，尚未入房'); uiIdle(); return; }
      if(!res.ok){ stopRing(); setCallPhase('error','通话服务无法签发凭证（'+res.status+'）'); resetCallLampsAfterFailure('无法取得通话凭证，尚未入房'); uiIdle(); return; }
      const d=await res.json();
      if(attempt!==callAttemptId) return;
      setCallPhase('joining');
      currentCallId=d.room||'';

      room=pendingRoom=new LK.Room({ adaptiveStream:true, dynacast:true });
      const callRoom=room, callId=currentCallId;
      callRoom.on(LK.RoomEvent.DataReceived,(payload,participant,kind,topic)=>{
        if(room!==callRoom || attempt!==callAttemptId) return;
        const event=window.YulingEmotionVideo.decodeAgentEmotionEvent({
          payload,participant,topic,room:callRoom,callId,isAgent:isAgentParticipant
        });
        if(event) emotionVideo.acceptEvent(event);
      });
      // AgentSession publishes STT and spoken replies as lk.transcription text
      // streams. The legacy TranscriptionReceived event does not receive them.
      callRoom.registerTextStreamHandler('lk.transcription',async(reader,participantInfo)=>{
        const attributes=reader.info&&reader.info.attributes||{};
        const isFinal=attributes['lk.transcription_final']==='true';
        const speakerIdentity=participantInfo&&participantInfo.identity;
        const segmentId=attributes['lk.segment_id']||(reader.info&&reader.info.id);
        if(!speakerIdentity || !segmentId || !callId) return;
        const role=speakerIdentity===callRoom.localParticipant.identity?'user':'assistant';
        let transcript='';
        try{
          // LiveKit yields text chunks. Accumulate them so a streamed
          // character never replaces the rest of the spoken sentence.
          for await(const update of reader){
            transcript+=String(update);
            if(room===callRoom && attempt===callAttemptId)
              showLiveTranscript(role,String(segmentId),transcript.trim(),isFinal);
          }
        }catch(_){ return; }
        transcript=transcript.trim();
        if(room!==callRoom || attempt!==callAttemptId || !isFinal || !transcript) return;
        showLiveTranscript(role,String(segmentId),transcript,true);
        if(role==='user') setLamp('stt','ok');
        else setLamp('llm','warn','本次已收到 Agent 文字回复；模型供应商尚未独立验证');
        saveFinalTranscript(callId,speakerIdentity,String(segmentId),role,transcript);
      });
      room.on(LK.RoomEvent.TrackSubscribed,(track,publication,participant)=>{
        if(room!==callRoom || attempt!==callAttemptId) return;
        // A call token joins a private, server-created agent room. Play every
        // remote audio track: some LiveKit clients report the worker as a
        // standard participant before its agent attributes arrive.
        if(track.kind===LK.Track.Kind.Audio){
          setLamp('audio','warn','已收到远端音轨，等待浏览器播放');
          const el=track.attach(); el.autoplay=true; el.playsInline=true;
          el.style.display='none'; document.body.appendChild(el);
          remoteAudioElements.set(track,el);
          // Keep the native media element audible. The optional WebAudio
          // booster can remain suspended in mobile browsers; muting this
          // element then silences an otherwise healthy remote track.
          if(el.play) Promise.resolve(el.play()).then(()=>{
            if(room===callRoom && lastBaoVoiceAt===0)
              setLamp('audio','warn','音轨已解锁，等待端倪实际发声');
          }).catch(()=>{
            if(room!==callRoom) return;
            clearCallAnswerTimer();
            setLamp('audio','bad','已收到音轨，但浏览器阻止播放；请点屏幕重试或用外部浏览器打开');
            setCallPhase('error','声音被浏览器阻止，请点屏幕重试');
            clearAudioRetry();
            audioRetryHandler=()=>{
              audioRetryHandler=null;
              if(room!==callRoom) return;
              Promise.resolve(el.play()).then(()=>{
                if(room===callRoom){
                  setLamp('audio','warn','音轨已解锁，等待端倪实际发声');
                  armCallAnswerTimer(callRoom,attempt);
                  if(agentState) applyAgentState(agentState); else setCallPhase('waiting');
                }
              }).catch(()=>{});
            };
            document.addEventListener('pointerdown',audioRetryHandler,{once:true});
          });
          baoCalc=makeVol(track);          // 陈端倪发声 → 光球反应
        }
      });
      room.on(LK.RoomEvent.TrackUnsubscribed,(track,publication,participant)=>{
        if(track.kind===LK.Track.Kind.Audio){
          const el=remoteAudioElements.get(track);
          if(el){ try{ track.detach(el); }catch(_){} el.remove(); remoteAudioElements.delete(track); }
          if(room!==callRoom) return;
          baoCalc=null;
          setLamp('audio','warn');
        }
      });
      room.on(LK.RoomEvent.ParticipantConnected,(p)=>{
        if(!isAgentParticipant(p)) return;
        setLamp('agent','ok');
        const s=p&&p.attributes&&p.attributes['lk.agent.state'];
        if(s) applyAgentState(s); else setCallPhase('waiting');
      });
      room.on(LK.RoomEvent.ParticipantDisconnected,()=>syncAgentLamp(callRoom));
      room.on(LK.RoomEvent.ParticipantAttributesChanged,(changed,participant)=>{
        if(!isAgentParticipant(participant)) return;
        const s=changed&&changed['lk.agent.state'];
        if(s) applyAgentState(s);
      });
      room.on(LK.RoomEvent.Reconnecting,()=>{
        if(room!==callRoom) return;
        clearCallAnswerTimer();
        setLamp('room','warn','房间连接中断，正在重连');
        setCallPhase('reconnecting');
      });
      room.on(LK.RoomEvent.Reconnected,()=>{
        if(room!==callRoom) return;
        setLamp('room','ok');
        armCallAnswerTimer(callRoom,attempt);
        if(!syncAgentLamp(callRoom)){ setCallPhase('waiting'); return; }
        const agent=Array.from(callRoom.remoteParticipants.values()).find(isAgentParticipant);
        const state=agent&&agent.attributes&&agent.attributes['lk.agent.state'];
        if(state && AGENT_STATE[state]){
          callPhase='connected'; applyAgentState(state);
        }else setCallPhase('waiting');
      });
      room.on(LK.RoomEvent.Disconnected,()=>{
        if(room===callRoom && attempt===callAttemptId) cleanup('已断线');
      });

      await room.connect(d.url, d.token);
      if(attempt!==callAttemptId){ await pendingRoom.disconnect().catch(()=>{}); return; }
      roomJoined=true;
      setLamp('room','ok');
      if(agentState) applyAgentState(agentState);
      else setCallPhase('waiting');
      armCallAnswerTimer(callRoom,attempt);
      try{
        await room.localParticipant.setMicrophoneEnabled(true);
        if(attempt!==callAttemptId){ await pendingRoom.disconnect().catch(()=>{}); return; }
        setMic('ok');
        const mp=room.localParticipant.getTrackPublication(LK.Track.Source.Microphone);
        if(mp&&mp.track){
          micCalc=makeVol(mp.track);   // 你发声 → 光球反应
          bindAudioEventDetector(mp.track);
        }
      }catch(micErr){
        setMic('bad');
        throw new Error('麦克风无法启用。请允许麦克风权限，并用手机外部浏览器重新拨打');
      }
      connecting=false; uiInCall();
      const agentPresent=syncAgentLamp(callRoom);
      if(!agentState) setCallPhase('waiting');
      // 陈端倪已在房且已有状态 → 立刻反映 (避免错过第一个状态)
      try{ room.remoteParticipants.forEach(p=>{ if(!isAgentParticipant(p)) return; setLamp('agent','ok'); const s=p.attributes&&p.attributes['lk.agent.state']; if(s) applyAgentState(s); }); }catch(_){}
    }catch(e){
      if(attempt!==callAttemptId){ try{ await pendingRoom?.disconnect(); }catch(_){} return; }
      stopRing();
      clearCallAnswerTimer();
      clearAudioRetry();
      try{ await pendingRoom?.disconnect(); }catch(_){}
      setCallPhase('error',String(e&&e.message||'').startsWith('麦克风无法启用')?
        '麦克风无法启用，请允许权限后重试':'连接失败，请重试');
      resetCallLampsAfterFailure(roomJoined?'本次已离开房间':'无法加入 LiveKit 房间',roomJoined);
      if(String(e&&e.message||'').startsWith('麦克风无法启用')) setMic('bad');
      uiIdle(); room=null;
    }
  }

  function cleanup(msg){
    ++callAttemptId;
    emotionVideo.stop();
    const finishedCallId=currentCallId;
    stopRing();
    clearCallAnswerTimer(); callAnswered=false; callAnswerTimedOut=false;
    clearAudioRetry();
    for(const [track,el] of remoteAudioElements){
      try{ track.detach(el); }catch(_){}
      el.remove();
    }
    remoteAudioElements.clear();
    try{ if(audioEventFX.timer) clearInterval(audioEventFX.timer); audioEventFX.timer=null; audioEventFX.bound=false; }catch(_){}
    micCalc=null; baoCalc=null;       // 声浪源归零 → 光球回待机呼吸
    room=null; muted=false; agentState=''; currentCallId=''; setMic(''); setLamp('room',''); setLamp('agent',''); setLamp('audio','');
    resetLiveDialogue();
    setLamp('stt',''); setLamp('llm',''); setLamp('tts',''); uiIdle(); setCallPhase(msg==='已断线'?'disconnected':'ended');
    if(finishedCallId){
      // The server reads only this authenticated owner's saved final events.
      // No transcript text travels in this request. Never auto-retry a paid call.
      transcriptSaveQueue.then(async()=>{
        if(failedTranscriptCalls.has(finishedCallId) || !savedTranscriptCalls.has(finishedCallId)) return;
        try{
          await fetch(apiUrl('/api/v2/calls/'+encodeURIComponent(finishedCallId)+'/reflection'),{
            method:'POST', credentials:'same-origin',
            headers:{'Content-Type':'application/json'}, body:'{}'
          });
          if(!innerPanel.classList.contains('hidden')) loadInner();
        }catch(_){ /* The menu shows a failed or pending state for manual retry. */ }
      });
    }
  }
  async function endCall(){
    const endingRoom=room;
    cleanup('已挂断');
    if(endingRoom){
      try{
        await Promise.race([
          endingRoom.disconnect(),
          new Promise(resolve=>setTimeout(resolve,2000))
        ]);
      }catch(_){}
    }
  }

  const logPanel=$('logPanel'), logBody=$('logBody'), logTitle=$('logTitle'), logBack=$('logBack');

  function fmtWhen(ts){            // API epoch seconds, or legacy local timestamp.
    if(!ts) return '';
    if(typeof ts==='number') return new Date(ts*1000).toLocaleString('zh-CN',{
      month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
    const m=ts.match(/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})/);
    if(!m) return ts;
    const wd='日一二三四五六'[new Date(+m[1],+m[2]-1,+m[3]).getDay()];
    return `${+m[2]}/${+m[3]}（周${wd}）${m[4]}:${m[5]}`;
  }

        const c=VERTYPE[e.type]||'#8a8f98';
        const el=document.createElement('div'); el.className='veritem';
        el.innerHTML=`<div class="vh"><span class="vtype" style="background:${c}22;color:${c};border:1px solid ${c}66">${esc(e.type)}</span><span class="vtime">${esc(e.ts)}</span></div>`+
          `<div class="vtitle">${esc(e.title)}</div>`+
          (e.desc?`<div class="vdesc">${esc(e.desc)}</div>`:'');
        verBody.appendChild(el);
      });
    }catch(err){ verBody.innerHTML='<div class="logempty">读取失败，请稍后再试。</div>'; }
  }
  $('verLink').addEventListener('click',()=>{ verPanel.classList.remove('hidden'); loadVer(); });
  verBack.addEventListener('click',()=>verPanel.classList.add('hidden'));
  verPanel.addEventListener('click',e=>{ if(e.target===verPanel) verPanel.classList.add('hidden'); });

  // ── 通话后心声：公开的逐字稿回望，不声称隐藏思想 ──
  const innerPanel=$('innerPanel'), innerBody=$('innerBody'), innerBack=$('innerBack');
  async function retryReflection(callId){
    const button=innerBody.querySelector('[data-retry-call="'+callId+'"]');
    if(button) button.disabled=true;
    try{
      await fetch(apiUrl('/api/v2/calls/'+encodeURIComponent(callId)+'/reflection'),{
        method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({retry:true})
      });
    }catch(_){ /* The saved failure stays visible after refreshing the list. */
    }finally{ await loadInner(); }
  }
  async function loadInner(){
    innerBody.innerHTML='<div class="logempty">载入中…</div>';
    try{
      const r=await fetch(apiUrl('/api/v2/call-reflections'),{credentials:'same-origin'});
      if(r.status===401){ innerBody.innerHTML='<div class="logempty">请先登录。</div>'; return; }
      if(!r.ok) throw new Error('inner request failed');
      const payload=await r.json();
      const items=payload.items||[];
      if(!items.length){ innerBody.innerHTML='<div class="logempty">还没有通话后心声。内容较多且有具体重点的通话，挂断后才会生成。</div>'; return; }
      innerBody.innerHTML='';
      items.forEach(e=>{
        const el=document.createElement('div'); el.className='inneritem';
        const detail=e.status==='generated'
          ? esc(e.text||'')
          : e.status==='skipped' ? '这通内容没有需要记录的心声。'
          : e.status==='processing' ? '正在根据这通逐字稿整理…'
          : '这通未生成心声。';
        el.innerHTML=`<div class="it">🤍 ${esc(fmtWhen(e.created_at))} · 根据本次通话逐字稿生成</div>`+
          `<div class="ix">${detail}</div>`;
        if(e.status==='failed'){
          const retry=document.createElement('button');
          retry.type='button'; retry.textContent='手动重试';
          retry.dataset.retryCall=e.call_id;
          retry.addEventListener('click',()=>retryReflection(e.call_id));
          el.appendChild(retry);
        }
        innerBody.appendChild(el);
      });
    }catch(err){ innerBody.innerHTML='<div class="logempty">读取失败，请稍后再试。</div>'; }
  }
  $('innerOpenBtn').addEventListener('click',()=>{ closeMenu(false); innerPanel.classList.remove('hidden'); loadInner(); });
  innerBack.addEventListener('click',()=>innerPanel.classList.add('hidden'));
  innerPanel.addEventListener('click',e=>{ if(e.target===innerPanel) innerPanel.classList.add('hidden'); });

  meetingRecordBtn.addEventListener('click',()=>{
    if(meetingRec.isRecording) stopMeetingRecording();
    else startMeetingRecording();
  });
  meetingFormalBtn&&meetingFormalBtn.addEventListener('click', finalizeMeetingFormalNotes);
  meetingPauseBtn.addEventListener('click', toggleMeetingPause);
  meetingDiscardBtn.addEventListener('click', discardMeetingRecording);
  meetingSaveAudioToggle&&meetingSaveAudioToggle.addEventListener('change',()=>{
    meetingRec.saveAudio=!!meetingSaveAudioToggle.checked;
    setMeetingUi();
  });

  function beginMeetingDrag(clientX, clientY, target){
    if(!MEETING_ENABLED) return;
    if(activeOverlayOpen()) return;
    const active=document.activeElement;
    if(active && /input|textarea|select/i.test(active.tagName||'')) return;
    if(target && target.closest && target.closest('button, a, input, textarea, select, canvas, [data-noswipe]')) return;
    meetingDrag={startX:clientX, startY:clientY, lastX:clientX, base:meetingProgress, axis:'pending'};
    setMeetingProgress(meetingProgress,false);
  }
  function moveMeetingDrag(clientX){
    if(!meetingDrag) return;
    meetingDrag.lastX=clientX;
    const delta=clientX-meetingDrag.startX;
    const width=Math.min(innerWidth*0.94, 560);
    const next=meetingDrag.base + (delta/Math.max(240,width));
    setMeetingProgress(next,false);
  }
  function endMeetingDrag(clientX){
    if(!meetingDrag) return;
    const delta=clientX-meetingDrag.startX;
    const shouldOpen=meetingProgress>0.5 || delta>72;
    meetingDrag=null;
    setMeetingProgress(shouldOpen?1:0,true);
  }
  function updateMeetingDrag(clientX, clientY){
    if(!meetingDrag) return false;
    const dx=clientX-meetingDrag.startX;
    const dy=clientY-meetingDrag.startY;
    if(meetingDrag.axis==='pending'){
      if(Math.abs(dx)<12 && Math.abs(dy)<12) return false;
      if(Math.abs(dx) > Math.abs(dy)+6){
        meetingDrag.axis='x';
      }else if(Math.abs(dy) >= Math.abs(dx)){
        meetingDrag=null;
        return false;
      }
    }
    if(meetingDrag.axis!=='x') return false;
    moveMeetingDrag(clientX);
    return true;
  }

  document.addEventListener('touchstart',e=>{
    if(!e.touches || e.touches.length!==1) return;
    const touch=e.touches[0];
    beginMeetingDrag(touch.clientX, touch.clientY, e.target);
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!meetingDrag || !e.touches || e.touches.length!==1) return;
    const touch=e.touches[0];
    if(updateMeetingDrag(touch.clientX, touch.clientY)) e.preventDefault();
  },{passive:false});
  document.addEventListener('touchend',e=>{
    if(!meetingDrag) return;
    const touch=e.changedTouches && e.changedTouches[0];
    if(meetingDrag.axis==='x'){
      endMeetingDrag(touch ? touch.clientX : meetingDrag.lastX);
      return;
    }
    meetingDrag=null;
  },{passive:true});

  document.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse' && innerWidth>900) return;
    beginMeetingDrag(e.clientX, e.clientY, e.target);
  });
  document.addEventListener('pointermove',e=>{ updateMeetingDrag(e.clientX, e.clientY); });
  document.addEventListener('pointerup',e=>{
    if(!meetingDrag) return;
    if(meetingDrag.axis==='x'){
      endMeetingDrag(e.clientX);
      return;
    }
    meetingDrag=null;
  });
  document.addEventListener('pointercancel',()=>{
    if(!meetingDrag) return;
    const shouldOpen=meetingProgress>0.5;
    meetingDrag=null;
    setMeetingProgress(shouldOpen?1:0,true);
  });
  window.addEventListener('keydown',e=>{
    if(!MEETING_ENABLED) return;
    if(activeOverlayOpen()) return;
    if(e.key==='ArrowRight') openMeetingView();
    if(e.key==='ArrowLeft') closeMeetingView();
  });

  if(!LK){ setStatus('语音元件载入失败，请重新整理'); callBtn.disabled=true; }
  else uiIdle();

  setMeetingProgress(0,true);
  refreshSwipeHint();
  setMeetingUi();
  resizeMeetingWave();
  if(MEETING_ENABLED) loadMeetingHistory();
  window.addEventListener('resize',()=>{
    resizeMeetingWave();
    setMeetingProgress(meetingProgress,false);
  });
  if(MEETING_ENABLED) setInterval(tickMeetingRecording, 250);

  setMic('');                       // MIC 待机灰
  pollHealth();                     // 开机先点亮一次
  setInterval(pollHealth, 20000);   // 每 20 秒巡一次

  // 本地时钟 (跟陈端倪 prompt 同一套时间/时段, 视觉呈现)
  const clockEl=$('clock');
  function updateClock(){
    const t=new Date(Date.now()+ (new Date().getTimezoneOffset()*60000) + 8*3600000); // → UTC+8
    const h=t.getHours();
    const seg = h<5?'半夜':h<8?'清晨':h<11?'早上':h<13?'中午':h<17?'下午':h<19?'傍晚':h<23?'晚上':'半夜';
    const wd='日一二三四五六'[t.getDay()];
    const mm=String(t.getMinutes()).padStart(2,'0');
    clockEl.textContent=`${t.getFullYear()}/${t.getMonth()+1}/${t.getDate()} 周${wd} · ${seg} ${t.getHours()}:${mm}`;
  }
  updateClock(); setInterval(updateClock, 15000);
})();
</script>
</body>
</html>
