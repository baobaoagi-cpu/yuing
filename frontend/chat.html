<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080a09">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dunni">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/assets/dunni-icon-v1-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/dunni-icon-v1-180.png">
  <link rel="stylesheet" href="/chat.css">
  <link rel="stylesheet" href="/pull-refresh.css">
  <title>陳端倪 · Dunni</title>
</head>
<body data-yuling-view="chat">
  <div class="app-shell">
    <header class="topbar">
      <div class="identity" aria-label="正在与陳端倪对话">
        <span class="avatar" aria-hidden="true"><span class="avatar-light"></span></span>
        <span class="identity-copy"><strong>陳端倪</strong><span id="current-account-label">Dunni</span></span>
      </div>
      <div class="topbar-actions">
        <button class="memory-button" id="memory-button" type="button" aria-label="记忆设置" aria-expanded="false" aria-controls="memory-panel" title="记忆设置" hidden>记</button>
        <button class="install-button" id="install-button" type="button" aria-label="安装 Dunni 到手机" aria-expanded="false" aria-controls="install-panel" title="安装到手机">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v11m0 0 4-4m-4 4-4-4M5 16v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="refresh-button call-link" id="refresh-button" type="button" aria-label="刷新并获取最新版本" title="刷新并获取最新版本">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.7 9a7 7 0 0 1 12.3-2L20 12M4 12l2 5a7 7 0 0 0 12.3-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <a class="call-link" href="/call" aria-label="进入语音通话" title="语音通话">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m7.4 3.7-2.3 1a2.3 2.3 0 0 0-1.3 2.6A17.8 17.8 0 0 0 16.7 20a2.3 2.3 0 0 0 2.6-1.3l1-2.3a1.6 1.6 0 0 0-.8-2.1l-2.8-1.2a1.6 1.6 0 0 0-1.8.4l-1.1 1.1a13.3 13.3 0 0 1-4.4-4.4l1.1-1.1a1.6 1.6 0 0 0 .4-1.8L9.5 4.5a1.6 1.6 0 0 0-2.1-.8Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </a>
        <button class="tool-menu-button" id="tool-menu-button" type="button" aria-label="打开工具菜单" aria-expanded="false" aria-controls="tool-menu" title="工具菜单">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div id="install-panel" class="install-panel" role="dialog" aria-labelledby="install-title" hidden>
        <button id="install-close" class="install-close" type="button" aria-label="关闭安装说明">×</button>
        <strong id="install-title">把 Dunni 放到手机桌面</strong>
        <p id="install-instructions"></p>
      </div>
      <section id="memory-panel" class="memory-panel" aria-labelledby="memory-title" hidden>
        <button id="memory-close" class="memory-close" type="button" aria-label="关闭记忆设置">×</button>
        <strong id="memory-title">关于你的记忆</strong>
        <p>端倪可以把你主动说出的喜好、习惯和需要记成待确认的线索，继续了解你。不会把猜测当成事实。你可以随时关闭记录，逐条删除线索。</p>
        <div id="memory-choice" class="memory-actions" hidden>
          <button id="memory-allow" type="button">允许记录</button>
          <button id="memory-decline" type="button">暂不记录</button>
        </div>
        <div id="memory-settings" hidden>
          <p id="memory-state"></p>
          <button id="memory-toggle" type="button"></button>
          <ul id="memory-facts" aria-label="已记录的个人线索"></ul>
        </div>
        <p id="memory-error" class="memory-error" role="status" aria-live="polite" hidden></p>
      </section>
      <section id="tool-menu" class="tool-menu" aria-labelledby="tool-menu-title" hidden>
        <div class="tool-menu-heading"><strong id="tool-menu-title">实用工具</strong><button id="tool-menu-close" type="button" aria-label="关闭工具菜单">×</button></div>
        <p class="tool-menu-intro">绿色可使用；灰色尚未接入或暂不可接入。</p>
        <div id="tool-menu-content">正在检查工具状态…</div>
        <div class="tool-menu-account">
          <button id="logout-button" class="tool-logout" type="button">退出登录</button>
          <p id="logout-status" class="tool-logout-status" role="status" aria-live="polite" hidden></p>
        </div>
      </section>
    </header>

    <main class="conversation" id="conversation" aria-label="对话内容">
      <div class="conversation-inner" id="message-list"></div>
      <div class="intro" id="intro" aria-label="陈端倪在这里陪你聊天">
        <video id="intro-video" class="intro-video" src="/yuling-media/chen-dunni-loop.m4v"
          poster="/yuling-media/chen-dunni-poster.jpg" autoplay muted loop playsinline
          preload="metadata" aria-hidden="true"></video>
      </div>
    </main>

    <div class="composer-wrap">
      <div id="global-status" class="global-status" role="status" aria-live="polite" hidden></div>
      <div id="emoji-panel" class="emoji-panel" hidden aria-label="选择表情"></div>
      <div id="attachment" class="attachment" hidden>
        <img id="attachment-image" alt="待发送图片预览" hidden>
        <span id="attachment-file-icon" class="attachment-file-icon" aria-hidden="true" hidden>文</span>
        <span class="attachment-copy"><strong id="attachment-name"></strong><small id="attachment-note">发送后会交给端倪查看</small></span>
        <button id="remove-attachment" type="button" aria-label="移除附件">×</button>
      </div>
      <div id="url-preview" class="url-preview" hidden><span class="url-icon" aria-hidden="true">↗</span><span><small id="url-preview-status">网址卡片 · 未读取网页内容</small><strong id="url-host"></strong></span><button id="remove-url" type="button" aria-label="移除网址">×</button></div>
      <div id="page-reference" class="page-reference" hidden>
        <span class="page-reference-copy"><strong>引用网页摘录</strong><small id="page-reference-host"></small></span>
        <button id="remove-page-reference" type="button" aria-label="移除网页引用">×</button>
      </div>
      <form id="chat-form" class="composer" autocomplete="off">
        <button class="attach-button" id="attach-button" type="button" title="添加图片或文件" aria-label="添加图片或文件">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 4v16M4 12h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <input id="image-input" type="file" accept="image/jpeg,image/png,image/webp,.pdf,.docx,.pptx,.xlsx,.txt,.md,.csv,.doc,.xls,.ppt,.wps,.et,.dps,.ofd" hidden>
        <button class="emoji-button" id="emoji-button" type="button" title="选择表情" aria-label="选择表情" aria-expanded="false" aria-controls="emoji-panel">☺</button>
        <label class="sr-only" for="message-input">发送消息</label>
        <textarea id="message-input" rows="1" maxlength="4000" placeholder="发消息…" enterkeyhint="send"></textarea>
        <button class="send-button" id="send-button" type="submit" aria-label="发送消息" disabled>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m5 12 14-7-4 14-3.1-5.9L5 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m19 5-7.1 8.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </form>
      <p class="composer-footnote"><span id="deployment-version" role="status" aria-live="polite">版本确认中…</span></p>
    </div>
  </div>
  <script type="module" src="/chat.js"></script>
  <script src="/swipe-navigation.js" defer></script>
  <script src="/tool-menu.js" defer></script>
  <script src="/update.js" defer></script>
  <script src="/pull-refresh.js" defer></script>
</body>
</html>
