<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#161916">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dunni">
  <link rel="icon" href="/assets/dunni-icon-v1-192.png" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/dunni-icon-v1-180.png">
  <link rel="stylesheet" href="/login-minimal.css">
  <title>登录 · Dunni</title>
</head>
<body>
  <main class="login-screen">
    <video class="login-video" autoplay muted loop playsinline webkit-playsinline preload="metadata" poster="/assets/dunni-login-poster.jpg" aria-hidden="true">
      <source src="/assets/dunni-login-loop.mp4" type="video/mp4">
    </video>
    <div class="login-shade" aria-hidden="true"></div>
    <h1 class="login-name">Dunni</h1>
    <form id="login-form" class="login-form" aria-label="登录端倪" novalidate>
      <label class="visually-hidden" for="username">帐号</label>
      <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required placeholder="帐号">
      <label class="visually-hidden" for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="密码">
      <p class="login-error" id="login-error" role="alert" aria-live="polite" hidden></p>
      <button type="submit" id="login-submit">登录</button>
    </form>
  </main>
  <script type="module" src="/login.js"></script>
</body>
</html>
