<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3efe7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="YULING">
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icon-180.png">
  <link rel="stylesheet" href="/style.css">
  <title>登录 · YULING 语灵</title>
</head>
<body class="login-page">
  <main class="login-shell">
    <header class="login-header">
      <div class="brand" aria-label="YULING 语灵"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 36 36" fill="none"><path d="M5 18h4l3-8 5 16 4-12 3 4h7" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="brand-word">YULING <small>语灵 · 陈端倪</small></span></div>
      <span class="login-edition">PRIVATE PREVIEW / 01</span>
    </header>
    <section class="login-layout" aria-labelledby="login-title">
      <div class="login-story">
        <p class="eyebrow">一个懂得倾听的开始</p>
        <h1>听见你，<br><em>也听见生活。</em></h1>
        <p>欢迎来到语灵。登录后，在 iPhone 上体验端倪的声音感知与目前已接通的基础能力。</p>
        <div class="login-wave" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
      </div>
      <div class="login-card">
        <p class="login-card-kicker">YULING ACCESS</p>
        <h2 id="login-title">欢迎回来</h2>
        <p class="login-card-intro">输入帐号与密码，继续测试语灵。</p>
        <form id="login-form" novalidate>
          <label for="username">帐号</label>
          <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required placeholder="请输入帐号">
          <label for="password">密码</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="请输入密码">
          <label class="remember-row" for="remember"><input id="remember" name="remember" type="checkbox"><span>保持登录 30 天</span></label>
          <p class="login-error" id="login-error" role="alert" aria-live="polite" hidden></p>
          <button class="login-submit" type="submit" id="login-submit">登录语灵 <span aria-hidden="true">↗</span></button>
        </form>
        <p class="login-note">仅供授权的内部测试者使用。</p>
      </div>
    </section>
    <footer class="login-footer"><span>YULING · PRIVATE PREVIEW</span><span>陪伴，从听见开始。</span></footer>
  </main>
  <script type="module" src="/login.js"></script>
</body>
</html>
